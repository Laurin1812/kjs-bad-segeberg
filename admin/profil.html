<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Profil – KJS Bad Segeberg Admin</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
    .card h1 { color: #1e4620; font-size: 1.4rem; margin-bottom: .3rem; }
    .card p.sub { color: #888; font-size: .88rem; margin-bottom: 2rem; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: .75rem 0; border-bottom: 1px solid #eee; font-size: .95rem; }
    .info-row:last-of-type { border-bottom: none; }
    .info-row label { color: #555; font-weight: 600; }
    .info-row span { color: #222; }
    .btn { display: block; width: 100%; padding: .85rem; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; margin-top: .75rem; transition: background .2s; }
    .btn-green { background: #2e6b30; color: #fff; }
    .btn-green:hover { background: #1e4620; }
    .btn-outline { background: transparent; color: #2e6b30; border: 2px solid #2e6b30; }
    .btn-outline:hover { background: #e8f5e9; }
    .btn-back { background: transparent; color: #888; border: none; font-size: .85rem; cursor: pointer; margin-top: 1rem; text-decoration: underline; }
    .hint { background: #e8f5e9; border-radius: 8px; padding: 1rem; font-size: .84rem; color: #2e6b30; margin-top: 1.5rem; line-height: 1.6; }
    #loading { color: #888; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">Wird geladen …</div>
    <div id="content" style="display:none;">
      <h1>👤 Mein Profil</h1>
      <p class="sub">Angemeldet als Admin – KJS Bad Segeberg</p>

      <div class="info-row">
        <label>Name</label>
        <div style="display:flex;align-items:center;gap:.5rem;">
          <span id="user-name">–</span>
          <button id="editNameBtn" title="Name bearbeiten" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:0;color:#2e6b30;">✏️</button>
        </div>
      </div>
      <div id="name-edit-row" style="display:none;padding:.75rem 0;border-bottom:1px solid #eee;">
        <input id="name-input" type="text" placeholder="Dein Name" style="width:100%;padding:.6rem .8rem;border:1.5px solid #2e6b30;border-radius:8px;font-size:.95rem;margin-bottom:.5rem;">
        <div style="display:flex;gap:.5rem;">
          <button class="btn btn-green" id="saveNameBtn" style="flex:1;padding:.6rem;">💾 Speichern</button>
          <button class="btn btn-outline" id="cancelNameBtn" style="flex:1;padding:.6rem;">Abbrechen</button>
        </div>
        <p id="name-msg" style="font-size:.82rem;margin-top:.4rem;color:#2e6b30;display:none;"></p>
      </div>
      <div class="info-row">
        <label>E-Mail</label>
        <span id="user-email">–</span>
      </div>
      <div class="info-row">
        <label>Rolle</label>
        <span id="user-role">–</span>
      </div>

      <button class="btn btn-green" id="changePasswordBtn" style="margin-top:1.5rem;">
        🔑 Passwort ändern
      </button>

      <div class="hint">
        💡 <strong>Passwort ändern:</strong> Klicke auf „Passwort ändern" – du bekommst eine E-Mail mit einem Link zum Zurücksetzen.<br><br>
        <strong>Name ändern:</strong> Klicke auf das ✏️ neben deinem Namen.
      </div>

      <button class="btn-back" onclick="window.location.href='/admin/'">← Zurück zum Admin</button>
    </div>
  </div>

  <script>
    if (window.netlifyIdentity) {
      var currentUser = null;

      window.netlifyIdentity.on('init', function(user) {
        if (!user) {
          window.location.href = '/login';
          return;
        }
        currentUser = user;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('user-name').textContent = user.user_metadata && user.user_metadata.full_name ? user.user_metadata.full_name : '(kein Name)';
        document.getElementById('user-email').textContent = user.email || '–';
        var roles = user.app_metadata && user.app_metadata.roles;
        document.getElementById('user-role').textContent = roles && roles.length ? roles.join(', ') : 'Admin';
      });

      // Name bearbeiten
      document.getElementById('editNameBtn').addEventListener('click', function() {
        var current = document.getElementById('user-name').textContent;
        document.getElementById('name-input').value = current === '(kein Name)' ? '' : current;
        document.getElementById('name-edit-row').style.display = 'block';
        document.getElementById('name-input').focus();
      });
      document.getElementById('cancelNameBtn').addEventListener('click', function() {
        document.getElementById('name-edit-row').style.display = 'none';
      });
      document.getElementById('saveNameBtn').addEventListener('click', function() {
        var newName = document.getElementById('name-input').value.trim();
        if (!newName) return;
        var btn = document.getElementById('saveNameBtn');
        btn.textContent = 'Wird gespeichert …';
        btn.disabled = true;
        currentUser.update({ data: { full_name: newName } })
          .then(function(updated) {
            currentUser = updated;
            document.getElementById('user-name').textContent = newName;
            document.getElementById('name-edit-row').style.display = 'none';
            var msg = document.getElementById('name-msg');
            msg.textContent = '✅ Name gespeichert!';
            msg.style.display = 'block';
            setTimeout(function(){ msg.style.display = 'none'; }, 3000);
            btn.textContent = '💾 Speichern';
            btn.disabled = false;
          })
          .catch(function() {
            btn.textContent = '💾 Speichern';
            btn.disabled = false;
            var msg = document.getElementById('name-msg');
            msg.textContent = '❌ Fehler beim Speichern – bitte erneut versuchen.';
            msg.style.color = '#c0392b';
            msg.style.display = 'block';
          });
      });

      // Passwort-Reset
      document.getElementById('changePasswordBtn').addEventListener('click', function() {
        var email = document.getElementById('user-email').textContent;
        if (!email || email === '–') return;
        fetch('/.netlify/identity/recover', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        }).then(function() {
          document.getElementById('changePasswordBtn').textContent = '✅ E-Mail gesendet! Bitte Postfach prüfen.';
          document.getElementById('changePasswordBtn').style.background = '#388e3c';
          document.getElementById('changePasswordBtn').disabled = true;
        }).catch(function() {
          window.netlifyIdentity.open();
        });
      });
    }
  </script>
</body>
</html>
