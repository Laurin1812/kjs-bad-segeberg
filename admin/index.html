<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – KJS Bad Segeberg</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Rollenprüfung: Redakteure gehören zu /redaktion, nicht hierher
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (user) {
          var roles = user.app_metadata && user.app_metadata.roles;
          var isEditor = roles && roles.some(function(r){
            return r.toLowerCase()==='editor' || r.toLowerCase()==='redakteur';
          });
          if (isEditor) { window.location.href = "/redaktion/"; }
        }
      });
    }
  </script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <style>
    #profil-btn {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      background: #2e6b30; color: #fff; border: none; border-radius: 50px;
      padding: .6rem 1.2rem; font-size: .85rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25);
      text-decoration: none; display: flex; align-items: center; gap: .4rem;
    }
    #profil-btn:hover { background: #1e4620; }
  </style>
  <a id="profil-btn" href="/admin/profil.html">👤 Mein Profil</a>
</body>
</html>
