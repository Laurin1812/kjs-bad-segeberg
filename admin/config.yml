backend:
  name: git-gateway
  branch: main

locale: de

media_folder: "images"
public_folder: "/images"

collections:

  # ──────────────────────────────────────────
  # TERMINE
  # ──────────────────────────────────────────
  - name: "termine"
    label: "📅 Termine"
    files:
      - label: "Veranstaltungskalender"
        name: "kalender"
        file: "content/termine.json"
        fields:
          - label: "Termine"
            name: "termine"
            widget: "list"
            summary: "{{fields.datum}} – {{fields.veranstaltung}}"
            fields:
              - { label: "Datum",        name: "datum",         widget: "date",   format: "DD.MM.YYYY", hint: "Datum aus Kalender wählen" }
              - { label: "Uhrzeit",      name: "uhrzeit",       widget: "string", hint: "z.B. 18:00 Uhr" }
              - { label: "Veranstaltung",name: "veranstaltung", widget: "string" }
              - { label: "Ort",          name: "ort",           widget: "string" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                options:
                  - "Vorstand"
                  - "Schießwesen"
                  - "Hundeausbildung"
                  - "Jagdhornblasen"
                  - "Jugend"
                  - "Hegering"
                  - "Naturschutz"
                  - "Ausbildung"
                  - "Kreisveranstaltung"
                  - "Hauptversammlung"
                  - "Tradition"

  # ──────────────────────────────────────────
  # AKTUELLES / NEWS
  # ──────────────────────────────────────────
  - name: "aktuelles"
    label: "📰 Aktuelles"
    files:
      - label: "Newsbeiträge"
        name: "news"
        file: "content/aktuelles.json"
        fields:
          - label: "Beiträge"
            name: "beitraege"
            widget: "list"
            summary: "{{fields.datum}} – {{fields.titel}}"
            fields:
              - { label: "Titel",           name: "titel",     widget: "string" }
              - { label: "Datum",           name: "datum",     widget: "date",   format: "DD. MMMM YYYY", hint: "Datum aus Kalender wählen" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                options:
                  - "Allgemein"
                  - "Naturschutz"
                  - "Jagd"
                  - "Jungwildrettung"
                  - "Hundeausbildung"
                  - "Schießwesen"
                  - "Jugend"
                  - "Jagdhornblasen"
                  - "Veranstaltung"
                  - "Pressemitteilung"
              - { label: "Bild",            name: "bild",      widget: "image",  required: false }
              - { label: "Kurzbeschreibung",name: "text",      widget: "markdown" }
              - { label: "Link (optional)", name: "link",      widget: "string", required: false }

  # ──────────────────────────────────────────
  # VORSTAND & ANSPRECHPARTNER
  # ──────────────────────────────────────────
  - name: "vorstand"
    label: "👥 Vorstand"
    files:
      - label: "Vorstandsmitglieder"
        name: "mitglieder"
        file: "content/vorstand.json"
        fields:
          - label: "Mitglieder"
            name: "mitglieder"
            widget: "list"
            summary: "{{fields.rolle}} – {{fields.name}}"
            fields:
              - { label: "Rolle / Funktion", name: "rolle",   widget: "string" }
              - { label: "Name",             name: "name",    widget: "string" }
              - { label: "E-Mail",           name: "email",   widget: "string", required: false }
              - { label: "Telefon",          name: "telefon", widget: "string", required: false }
              - { label: "Foto",             name: "bild",    widget: "image",  required: false, hint: "Portraitfoto hochladen" }

  # ──────────────────────────────────────────
  # OBLEUTE
  # ──────────────────────────────────────────
  - name: "obleute"
    label: "🎯 Obleute"
    files:
      - label: "Obleute"
        name: "obleute"
        file: "content/obleute.json"
        fields:
          - label: "Obleute"
            name: "obleute"
            widget: "list"
            summary: "{{fields.rolle}} – {{fields.name}}"
            fields:
              - { label: "Funktion / Fachbereich", name: "rolle",   widget: "string" }
              - { label: "Name",                   name: "name",    widget: "string" }
              - { label: "E-Mail",                 name: "email",   widget: "string", required: false }
              - { label: "Telefon",                name: "telefon", widget: "string", required: false }
              - { label: "Foto",                   name: "bild",    widget: "image",  required: false }

  # ──────────────────────────────────────────
  # HEGERINGE
  # ──────────────────────────────────────────
  - name: "hegeringe"
    label: "🌿 Hegeringe"
    files:
      - label: "Hegering-Übersicht"
        name: "hegeringe"
        file: "content/hegeringe.json"
        fields:
          - label: "Hegeringe"
            name: "hegeringe"
            widget: "list"
            summary: "{{fields.nummer}} – {{fields.name}}"
            fields:
              - { label: "Bezeichnung",   name: "nummer",    widget: "string", hint: "z.B. Hegering 1" }
              - { label: "Name",          name: "name",      widget: "string", hint: "z.B. Bad Segeberg – Stadt" }
              - label: "Geschlecht (Titel)"
                name: "geschlecht"
                widget: "select"
                default: "Hegeringsleiter/in"
                options:
                  - { label: "Hegeringsleiter (männlich)", value: "Hegeringsleiter" }
                  - { label: "Hegeringsleiterin (weiblich)", value: "Hegeringsleiterin" }
                  - { label: "Hegeringsleiter/in (divers/offen)", value: "Hegeringsleiter/in" }
              - { label: "Name Hegeringsleiter/in", name: "obmann", widget: "string" }
              - { label: "Gemeinden",     name: "gemeinden", widget: "string", hint: "Kommagetrennte Liste" }
              - { label: "E-Mail",        name: "email",     widget: "string", required: false }
              - { label: "Telefon",       name: "telefon",   widget: "string", required: false }

  # ──────────────────────────────────────────
  # IMPRESSUM
  # ──────────────────────────────────────────
  - name: "impressum"
    label: "📄 Impressum"
    files:
      - label: "Impressum"
        name: "impressum"
        file: "content/impressum.json"
        fields:
          - { label: "Vereinsname",          name: "verein",           widget: "string" }
          - { label: "Adresse",              name: "adresse",          widget: "text",   hint: "Straße, Hausnummer, PLZ Ort" }
          - { label: "Vertreten durch",      name: "vertreten_durch",  widget: "string", hint: "z.B. Klaus Rathje, Kreisjägermeister" }
          - { label: "Telefon",              name: "telefon",          widget: "string" }
          - { label: "E-Mail",               name: "email",            widget: "string" }
          - { label: "Registergericht",      name: "registergericht",  widget: "string" }
          - { label: "Registernummer",       name: "registernummer",   widget: "string" }
          - { label: "Verantwortlich (§18)", name: "verantwortlich",   widget: "text" }

  # ──────────────────────────────────────────
  # KREISJÄGERMEISTER
  # ──────────────────────────────────────────
  - name: "kreisjjaegermeister"
    label: "🏅 Kreisjägermeister"
    files:
      - label: "Kreisjägermeister"
        name: "kjm"
        file: "content/kreisjjaegermeister.json"
        fields:
          - { label: "Name",      name: "name",      widget: "string" }
          - { label: "E-Mail",    name: "email",      widget: "string" }
          - { label: "Telefon",   name: "telefon",    widget: "string" }
          - { label: "Foto",      name: "bild",       widget: "image",  required: false, hint: "Portraitfoto hochladen" }
          - { label: "Grußwort",  name: "grußwort",   widget: "text",   required: false, hint: "Jede Leerzeile = neuer Absatz" }

  # ──────────────────────────────────────────
  # FAQ
  # ──────────────────────────────────────────
  - name: "faq"
    label: "❓ FAQ"
    files:
      - label: "Häufige Fragen"
        name: "faq"
        file: "content/faq.json"
        fields:
          - label: "Kategorien"
            name: "kategorien"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Kategorie-Titel", name: "titel", widget: "string" }
              - label: "Fragen"
                name: "fragen"
                widget: "list"
                summary: "{{fields.frage}}"
                fields:
                  - { label: "Frage", name: "frage",   widget: "string" }
                  - { label: "Antwort", name: "antwort", widget: "text" }

  # ──────────────────────────────────────────
  # KONTAKT & ÖFFNUNGSZEITEN
  # ──────────────────────────────────────────
  - name: "einstellungen"
    label: "⚙️ Kontakt & Öffnungszeiten"
    files:
      - label: "Geschäftsstelle"
        name: "kontakt"
        file: "content/einstellungen.json"
        fields:
          - { label: "Telefon",  name: "telefon", widget: "string" }
          - { label: "E-Mail",   name: "email",   widget: "string" }
          - { label: "Adresse",  name: "adresse", widget: "text",  hint: "Jede Zeile = eine Zeile auf der Website" }
          - label: "Öffnungszeiten"
            name: "oeffnungszeiten"
            widget: "list"
            summary: "{{fields.tage}}: {{fields.zeiten}}"
            fields:
              - { label: "Tag(e)",  name: "tage",   widget: "string", hint: "z.B. Montag & Mittwoch" }
              - { label: "Uhrzeit", name: "zeiten", widget: "string", hint: "z.B. 10:00 – 12:00 Uhr" }
