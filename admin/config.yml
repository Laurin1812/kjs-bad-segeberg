backend:
  name: git-gateway
  branch: main

locale: de

media_folder: "images"
public_folder: "/images"

collections:

  # ──────────────────────────────────────────
  # TERMINE
  # ──────────────────────────────────────────
  - name: "termine"
    label: "📅 Termine"
    files:
      - label: "Veranstaltungskalender"
        name: "kalender"
        file: "content/termine.json"
        fields:
          - label: "Termine"
            name: "termine"
            widget: "list"
            summary: "{{fields.datum}} – {{fields.veranstaltung}}"
            fields:
              - { label: "Datum",        name: "datum",         widget: "datetime", date_format: "DD.MM.YYYY", time_format: false, hint: "Datum aus Kalender wählen" }
              - { label: "Uhrzeit",      name: "uhrzeit",       widget: "string", hint: "z.B. 18:00 Uhr" }
              - { label: "Veranstaltung",name: "veranstaltung", widget: "string" }
              - { label: "Ort",          name: "ort",           widget: "string" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                options:
                  - "Vorstand"
                  - "Schießwesen"
                  - "Hundeausbildung"
                  - "Jagdhornblasen"
                  - "Jugend"
                  - "Hegering"
                  - "Naturschutz"
                  - "Ausbildung"
                  - "Kreisveranstaltung"
                  - "Hauptversammlung"
                  - "Tradition"

  # ──────────────────────────────────────────
  # AKTUELLES / NEWS
  # ──────────────────────────────────────────
  - name: "aktuelles"
    label: "📰 Aktuelles"
    files:
      - label: "Newsbeiträge"
        name: "news"
        file: "content/aktuelles.json"
        fields:
          - label: "Beiträge"
            name: "beitraege"
            widget: "list"
            summary: "{{fields.titel}} ({{fields.datum}})"
            hint: "➕ Hinzufügen = neuer Beitrag | 🗑️ Löschen = auf den Pfeil klicken, dann Eintrag aufklappen und unten 'Entfernen' drücken, danach Speichern/Veröffentlichen nicht vergessen!"
            fields:
              - { label: "Titel",           name: "titel",     widget: "string" }
              - { label: "Datum",           name: "datum",     widget: "datetime", date_format: "DD. MMMM YYYY", time_format: false, hint: "Datum aus Kalender wählen" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                options:
                  - "Allgemein"
                  - "Naturschutz"
                  - "Jagd"
                  - "Jungwildrettung"
                  - "Hundeausbildung"
                  - "Schießwesen"
                  - "Jugend"
                  - "Jagdhornblasen"
                  - "Veranstaltung"
                  - "Pressemitteilung"
              - { label: "Bild",            name: "bild",      widget: "image",  required: false }
              - { label: "Kurzbeschreibung",name: "text",      widget: "markdown" }
              - { label: "Link (optional)", name: "link",      widget: "string", required: false }

  # ──────────────────────────────────────────
  # VORSTAND & ANSPRECHPARTNER
  # ──────────────────────────────────────────
  - name: "vorstand"
    label: "👥 Vorstand"
    files:
      - label: "Vorstandsmitglieder"
        name: "mitglieder"
        file: "content/vorstand.json"
        fields:
          - label: "Mitglieder"
            name: "mitglieder"
            widget: "list"
            summary: "{{fields.rolle}} – {{fields.name}}"
            fields:
              - { label: "Rolle / Funktion", name: "rolle",   widget: "string" }
              - { label: "Name",             name: "name",    widget: "string" }
              - { label: "E-Mail",           name: "email",   widget: "string", required: false }
              - { label: "Telefon",          name: "telefon", widget: "string", required: false }
              - { label: "Foto",             name: "bild",    widget: "image",  required: false, hint: "Portraitfoto hochladen" }

  # ──────────────────────────────────────────
  # OBLEUTE
  # ──────────────────────────────────────────
  - name: "obleute"
    label: "🎯 Obleute"
    files:
      - label: "Obleute"
        name: "obleute"
        file: "content/obleute.json"
        fields:
          - label: "Obleute"
            name: "obleute"
            widget: "list"
            summary: "{{fields.rolle}} – {{fields.name}}"
            fields:
              - { label: "Funktion / Fachbereich", name: "rolle",   widget: "string" }
              - { label: "Name",                   name: "name",    widget: "string" }
              - { label: "E-Mail",                 name: "email",   widget: "string", required: false }
              - { label: "Telefon",                name: "telefon", widget: "string", required: false }
              - { label: "Foto",                   name: "bild",    widget: "image",  required: false }

  # ──────────────────────────────────────────
  # HEGERINGE
  # ──────────────────────────────────────────
  - name: "hegeringe"
    label: "🌿 Hegeringe"
    files:
      - label: "Hegering-Übersicht"
        name: "hegeringe"
        file: "content/hegeringe.json"
        fields:
          - label: "Hegeringe"
            name: "hegeringe"
            widget: "list"
            summary: "{{fields.nummer}} – {{fields.name}} ({{fields.obmann}})"
            fields:
              - { label: "Hegering-Nummer", name: "nummer",    widget: "string", hint: "z.B. Hegering 1" }
              - { label: "Hegering-Name (Gebietsname)", name: "name", widget: "string", hint: "z.B. Bad Segeberg – Stadt" }
              - { label: "Name der Leitung", name: "obmann", widget: "string", hint: "Vor- und Nachname" }
              - label: "Titel der Leitung"
                name: "geschlecht"
                widget: "select"
                default: "Hegeringsleiter/in"
                options:
                  - { label: "Hegeringsleiter (Mann)", value: "Hegeringsleiter" }
                  - { label: "Hegeringsleiterin (Frau)", value: "Hegeringsleiterin" }
                  - { label: "Hegeringsleiter/in", value: "Hegeringsleiter/in" }
              - { label: "Gemeinden",     name: "gemeinden", widget: "string", hint: "Kommagetrennte Liste" }
              - { label: "E-Mail",        name: "email",     widget: "string", required: false }
              - { label: "Telefon",       name: "telefon",   widget: "string", required: false }

  # ──────────────────────────────────────────
  # IMPRESSUM
  # ──────────────────────────────────────────
  - name: "impressum"
    label: "📄 Impressum"
    files:
      - label: "Impressum"
        name: "impressum"
        file: "content/impressum.json"
        fields:
          - { label: "Vereinsname",          name: "verein",           widget: "string" }
          - { label: "Adresse",              name: "adresse",          widget: "text",   hint: "Straße, Hausnummer, PLZ Ort" }
          - { label: "Vertreten durch",      name: "vertreten_durch",  widget: "string", hint: "z.B. Klaus Rathje, Kreisjägermeister" }
          - { label: "Telefon",              name: "telefon",          widget: "string" }
          - { label: "E-Mail",               name: "email",            widget: "string" }
          - { label: "Registergericht",      name: "registergericht",  widget: "string" }
          - { label: "Registernummer",       name: "registernummer",   widget: "string" }
          - { label: "Verantwortlich (§18)", name: "verantwortlich",   widget: "text" }

  # ──────────────────────────────────────────
  # KREISJÄGERMEISTER
  # ──────────────────────────────────────────
  - name: "kreisjjaegermeister"
    label: "🏅 Kreisjägermeister"
    files:
      - label: "✏️ Grußwort bearbeiten"
        name: "kjm"
        file: "content/kreisjjaegermeister.json"
        fields:
          - label: "ℹ️ Hinweis"
            name: "hinweis"
            widget: "hidden"
            default: ""
            hint: "Name, E-Mail, Telefon und Foto werden automatisch aus dem Vorstand-Eintrag mit 'Kreisjägermeister' in der Rolle übernommen. Hier nur das Grußwort pflegen."
          - { label: "Grußwort",  name: "grußwort",   widget: "text",   required: false, hint: "Jede Leerzeile = neuer Absatz. Name, Foto & Kontakt kommen automatisch aus dem Vorstand." }

  # ──────────────────────────────────────────
  # FAQ
  # ──────────────────────────────────────────
  - name: "faq"
    label: "❓ FAQ"
    files:
      - label: "Häufige Fragen"
        name: "faq"
        file: "content/faq.json"
        fields:
          - label: "Kategorien"
            name: "kategorien"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Kategorie-Titel", name: "titel", widget: "string" }
              - label: "Fragen"
                name: "fragen"
                widget: "list"
                summary: "{{fields.frage}}"
                fields:
                  - { label: "Frage", name: "frage",   widget: "string" }
                  - { label: "Antwort", name: "antwort", widget: "text" }

  # ──────────────────────────────────────────
  # KONTAKT & ÖFFNUNGSZEITEN
  # ──────────────────────────────────────────
  - name: "einstellungen"
    label: "⚙️ Kontakt & Öffnungszeiten"
    files:
      - label: "Geschäftsstelle"
        name: "kontakt"
        file: "content/einstellungen.json"
        fields:
          - { label: "Telefon",  name: "telefon", widget: "string" }
          - { label: "E-Mail",   name: "email",   widget: "string" }
          - { label: "Adresse",  name: "adresse", widget: "text",  hint: "Jede Zeile = eine Zeile auf der Website" }
          - label: "Öffnungszeiten"
            name: "oeffnungszeiten"
            widget: "list"
            summary: "{{fields.tage}}: {{fields.zeiten}}"
            fields:
              - { label: "Tag(e)",  name: "tage",   widget: "string", hint: "z.B. Montag & Mittwoch" }
              - { label: "Uhrzeit", name: "zeiten", widget: "string", hint: "z.B. 10:00 – 12:00 Uhr" }

  # ──────────────────────────────────────────
  # WUNSCHLISTE / AUFGABEN
  # ──────────────────────────────────────────
  - name: "wunschliste"
    label: "📋 Wunschliste & Aufgaben"
    files:
      - label: "Aufgaben & Wünsche"
        name: "aufgaben"
        file: "content/wunschliste.json"
        fields:
          - label: "Aufgaben"
            name: "aufgaben"
            widget: "list"
            summary: "[{{fields.status}}] {{fields.titel}}"
            fields:
              - { label: "Titel / Aufgabe",  name: "titel",        widget: "string" }
              - { label: "Beschreibung",     name: "beschreibung", widget: "text",   required: false }
              - { label: "Bild / Screenshot",name: "bild",         widget: "image",  required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "offen"
                options:
                  - { label: "⏳ Offen",     value: "offen" }
                  - { label: "🔄 In Arbeit", value: "in-arbeit" }
                  - { label: "✅ Erledigt",  value: "erledigt" }

  # ──────────────────────────────────────────
  # EIGENE SEITEN
  # ──────────────────────────────────────────
  - name: "seiten"
    label: "📝 Eigene Seiten"
    files:
      - label: "Alle eigenen Seiten verwalten"
        name: "seiten"
        file: "content/seiten.json"
        fields:
          - label: "Seiten"
            name: "seiten"
            widget: "list"
            summary: "{{fields.titel}} ({{fields.veroeffentlicht}})"
            hint: "➕ Neue Seite hinzufügen | Slug = URL-Kürzel, nur Kleinbuchstaben und Bindestriche, z.B. warum-jagd"
            fields:
              - { label: "Seitentitel",         name: "titel",          widget: "string" }
              - { label: "Navigations-Label",   name: "nav_label",      widget: "string",   hint: "Kurzer Text fürs Menü, z.B. 'Warum Jagd?'" }
              - { label: "URL-Kürzel (Slug)",   name: "slug",           widget: "string",   hint: "Nur Kleinbuchstaben und Bindestriche, z.B. 'warum-jagd'" }
              - { label: "Im Menü anzeigen?",   name: "in_navigation",  widget: "boolean",  default: true }
              - { label: "Veröffentlicht?",     name: "veroeffentlicht", widget: "boolean", default: false }
              - { label: "Inhalt",              name: "inhalt",         widget: "markdown", hint: "Vollständiger Seiteninhalt mit Formatierung (Fett, Kursiv, Überschriften, Listen usw.)" }
