backend:
  name: git-gateway
  branch: main

locale: de

media_folder: "images"
public_folder: "/images"

collections:

  # ──────────────────────────────────────────
  # STARTSEITE
  # ──────────────────────────────────────────
  - name: "startseite"
    label: "🏠 Startseite"
    files:
      - label: "Startseite"
        name: "startseite"
        file: "content/startseite.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string", required: false }
          - { label: "Einleitungstext", name: "intro", widget: "text", required: false }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }

  # ──────────────────────────────────────────
  # JÄGER › KJS BAD SEGEBERG
  # ──────────────────────────────────────────
  - name: "jaeger_kjs"
    label: "🦌 Jäger › KJS Bad Segeberg"
    files:
      - label: "Übersicht"
        name: "uebersicht"
        file: "content/jaeger/uebersicht.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string", required: false }
          - { label: "Einleitungstext", name: "intro", widget: "text", required: false }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
      - label: "Vorstand"
        name: "mitglieder"
        file: "content/vorstand.json"
        fields:
          - label: "Mitglieder"
            name: "mitglieder"
            widget: "list"
            summary: "{{fields.rolle}} – {{fields.name}}"
            fields:
              - { label: "Rolle / Funktion", name: "rolle",   widget: "string" }
              - { label: "Name",             name: "name",    widget: "string" }
              - { label: "E-Mail",           name: "email",   widget: "string", required: false }
              - { label: "Telefon",          name: "telefon", widget: "string", required: false }
              - { label: "Foto",             name: "bild",    widget: "image",  required: false, hint: "Portraitfoto hochladen" }
      - label: "Obleute"
        name: "obleute"
        file: "content/obleute.json"
        fields:
          - label: "Obleute"
            name: "obleute"
            widget: "list"
            summary: "{{fields.rolle}} – {{fields.name}}"
            fields:
              - { label: "Funktion / Fachbereich", name: "rolle",   widget: "string" }
              - { label: "Name",                   name: "name",    widget: "string" }
              - { label: "E-Mail",                 name: "email",   widget: "string", required: false }
              - { label: "Telefon",                name: "telefon", widget: "string", required: false }
              - { label: "Foto",                   name: "bild",    widget: "image",  required: false }
      - label: "Hegeringe"
        name: "hegeringe"
        file: "content/hegeringe.json"
        fields:
          - label: "Hegeringe"
            name: "hegeringe"
            widget: "list"
            summary: "{{fields.nummer}} – {{fields.name}} ({{fields.obmann}})"
            fields:
              - { label: "Hegering-Nummer", name: "nummer",    widget: "string", hint: "z.B. Hegering 1" }
              - { label: "Hegering-Name (Gebietsname)", name: "name", widget: "string" }
              - { label: "Name der Leitung", name: "obmann", widget: "string" }
              - label: "Titel der Leitung"
                name: "geschlecht"
                widget: "select"
                default: "Hegeringsleiter/in"
                options:
                  - { label: "Hegeringsleiter (Mann)", value: "Hegeringsleiter" }
                  - { label: "Hegeringsleiterin (Frau)", value: "Hegeringsleiterin" }
                  - { label: "Hegeringsleiter/in", value: "Hegeringsleiter/in" }
              - { label: "Gemeinden", name: "gemeinden", widget: "string", hint: "Kommagetrennte Liste" }
              - { label: "E-Mail",    name: "email",     widget: "string", required: false }
              - { label: "Telefon",   name: "telefon",   widget: "string", required: false }
      - label: "Mitglied werden"
        name: "mitglied_werden"
        file: "content/jaeger/mitglied-werden.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string", required: false }
          - { label: "Einleitungstext", name: "intro", widget: "text", required: false }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
      - label: "Jäger/in werden"
        name: "jaeger_werden"
        file: "content/jaeger/jaeger-werden.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string", required: false }
          - { label: "Einleitungstext", name: "intro", widget: "text", required: false }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
      - label: "Kreisjägermeister"
        name: "kjm"
        file: "content/kreisjjaegermeister.json"
        fields:
          - { label: "Name",            name: "name",     widget: "string",   required: false }
          - { label: "Foto",            name: "bild",     widget: "image",    required: false }
          - { label: "E-Mail",          name: "email",    widget: "string",   required: false }
          - { label: "Telefon",         name: "telefon",  widget: "string",   required: false }
          - label: "Aufgaben & Zuständigkeiten (Markdown)"
            name: "aufgaben"
            widget: "markdown"
            required: false
            hint: "Hier können Aufgaben, Listen und Texte zum Kreisjägermeister eingetragen werden."
          - label: "Grußwort"
            name: "grußwort"
            widget: "text"
            required: false
            hint: "Persönliches Grußwort, erscheint kursiv auf der Seite."
      - label: "➕ Neue KJS-Seite hinzufügen"
        name: "seiten_kjs"
        file: "content/seiten-kjs.json"
        fields:
          - label: "Seiten"
            name: "seiten"
            widget: "list"
            summary: "{{fields.nav_label}} ({{fields.slug}})"
            hint: "Klicke auf '+ Hinzufügen' um eine neue Unterseite unter 'KJS Bad Segeberg' anzulegen."
            fields:
              - { label: "Seitentitel",       name: "titel",           widget: "string" }
              - { label: "Menü-Label",        name: "nav_label",       widget: "string", hint: "Kurzer Text fürs Menü" }
              - { label: "URL-Kürzel (Slug)", name: "slug",            widget: "string", hint: "Nur Kleinbuchstaben und Bindestriche, z.B. 'jagdrecht'" }
              - { label: "Im Menü anzeigen?", name: "in_navigation",   widget: "boolean", default: true }
              - { label: "Veröffentlicht?",   name: "veroeffentlicht", widget: "boolean", default: false }
              - { label: "Inhalt",            name: "inhalt",          widget: "markdown", hint: "Seiteninhalt – Bilder können über den Bild-Button eingefügt werden" }

  # ──────────────────────────────────────────
  # JÄGER › AUFGABEN
  # ──────────────────────────────────────────
  - name: "aufgaben"
    label: "🎯 Jäger › Aufgaben der Kreisjägerschaft"
    files:
      - label: "Schießwesen"
        name: "schiessen"
        file: "content/aufgaben/schiessen.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Hundeausbildung"
        name: "hundeausbildung"
        file: "content/aufgaben/hundeausbildung.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Schweißhundeführer"
        name: "schweisshunde"
        file: "content/aufgaben/schweisshunde.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Jugendarbeit"
        name: "jugend"
        file: "content/aufgaben/jugend.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Jagdhornblasen"
        name: "jagdhorn"
        file: "content/aufgaben/jagdhorn.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Naturschutz"
        name: "naturschutz"
        file: "content/aufgaben/naturschutz.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Jungwildrettung"
        name: "jungwildrettung"
        file: "content/aufgaben/jungwildrettung.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Untertitel", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild (Inhalt)", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "➕ Neue Aufgaben-Seite hinzufügen"
        name: "seiten_aufgaben"
        file: "content/seiten-aufgaben.json"
        fields:
          - label: "Seiten"
            name: "seiten"
            widget: "list"
            summary: "{{fields.nav_label}} ({{fields.slug}})"
            hint: "Klicke auf '+ Hinzufügen' um eine neue Unterseite unter 'Aufgaben' anzulegen."
            fields:
              - { label: "Seitentitel",       name: "titel",           widget: "string" }
              - { label: "Menü-Label",        name: "nav_label",       widget: "string", hint: "Kurzer Text fürs Menü" }
              - { label: "URL-Kürzel (Slug)", name: "slug",            widget: "string", hint: "Nur Kleinbuchstaben und Bindestriche, z.B. 'jagdrecht'" }
              - { label: "Im Menü anzeigen?", name: "in_navigation",   widget: "boolean", default: true }
              - { label: "Veröffentlicht?",   name: "veroeffentlicht", widget: "boolean", default: false }
              - { label: "Inhalt",            name: "inhalt",          widget: "markdown", hint: "Seiteninhalt – Bilder können über den Bild-Button eingefügt werden" }

  # ──────────────────────────────────────────
  # JÄGER › WEITERE THEMEN
  # ──────────────────────────────────────────
  - name: "weitere_themen"
    label: "📋 Jäger › Weitere Themen"
    files:
      - label: "Infomobil (Seite bearbeiten)"
        name: "infomobil"
        file: "content/jaeger/infomobil.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text", required: false }
      - label: "➕ Neue Weitere-Themen-Seite hinzufügen"
        name: "seiten_weitere"
        file: "content/seiten-weitere.json"
        fields:
          - label: "Seiten"
            name: "seiten"
            widget: "list"
            summary: "{{fields.nav_label}} ({{fields.slug}})"
            hint: "Klicke auf '+ Hinzufügen' um eine neue Seite unter 'Weitere Themen' anzulegen."
            fields:
              - { label: "Seitentitel",       name: "titel",           widget: "string" }
              - { label: "Menü-Label",        name: "nav_label",       widget: "string", hint: "Kurzer Text fürs Menü" }
              - { label: "URL-Kürzel (Slug)", name: "slug",            widget: "string", hint: "Nur Kleinbuchstaben und Bindestriche, z.B. 'jagdrecht'" }
              - { label: "Im Menü anzeigen?", name: "in_navigation",   widget: "boolean", default: true }
              - { label: "Veröffentlicht?",   name: "veroeffentlicht", widget: "boolean", default: false }
              - { label: "Inhalt",            name: "inhalt",          widget: "markdown", hint: "Seiteninhalt – Bilder können über den Bild-Button eingefügt werden" }

  # ──────────────────────────────────────────
  # VERBRAUCHER
  # ──────────────────────────────────────────
  - name: "verbraucher_seiten"
    label: "🌿 Verbraucher"
    files:
      - label: "Wildfleisch"
        name: "wildfleisch"
        file: "content/verbraucher/wildfleisch.json"
        fields:
          - { label: "Seitentitel (H1)", name: "titel", widget: "string" }
          - { label: "Untertitel (H2)", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Lernort Natur"
        name: "lernort_natur"
        file: "content/verbraucher/lernort-natur.json"
        fields:
          - { label: "Seitentitel (H1)", name: "titel", widget: "string" }
          - { label: "Untertitel (H2)", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "Grünes Klassenzimmer"
        name: "gruenes_klassenzimmer"
        file: "content/verbraucher/gruenes-klassenzimmer.json"
        fields:
          - { label: "Seitentitel (H1)", name: "titel", widget: "string" }
          - { label: "Untertitel (H2)", name: "untertitel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text" }
          - { label: "Bild", name: "bild", widget: "image", required: false }
          - { label: "Bild Beschreibung", name: "bild_alt", widget: "string", required: false }
          - { label: "Hero-Hintergrundbild", name: "hero_bild", widget: "image", required: false, hint: "Großes Bild oben auf der Seite" }
          - { label: "Inhalt (Markdown)", name: "inhalt", widget: "markdown", required: false }
          - { label: "Kontakt Name", name: "kontakt_name", widget: "string", required: false }
          - { label: "Kontakt E-Mail", name: "kontakt_email", widget: "string", required: false }
      - label: "➕ Neue Verbraucher-Seite hinzufügen"
        name: "seiten_verbraucher"
        file: "content/seiten-verbraucher.json"
        fields:
          - label: "Seiten"
            name: "seiten"
            widget: "list"
            summary: "{{fields.nav_label}} ({{fields.slug}})"
            hint: "Klicke auf '+ Hinzufügen' um eine neue Unterseite unter 'Verbraucher' anzulegen."
            fields:
              - { label: "Seitentitel",       name: "titel",           widget: "string" }
              - { label: "Menü-Label",        name: "nav_label",       widget: "string", hint: "Kurzer Text fürs Menü" }
              - { label: "URL-Kürzel (Slug)", name: "slug",            widget: "string", hint: "Nur Kleinbuchstaben und Bindestriche, z.B. 'jagdfleisch'" }
              - { label: "Im Menü anzeigen?", name: "in_navigation",   widget: "boolean", default: true }
              - { label: "Veröffentlicht?",   name: "veroeffentlicht", widget: "boolean", default: false }
              - { label: "Inhalt",            name: "inhalt",          widget: "markdown", hint: "Seiteninhalt – Bilder können über den Bild-Button eingefügt werden" }

  # ──────────────────────────────────────────
  # TERMINE
  # ──────────────────────────────────────────
  - name: "termine"
    label: "📅 Termine"
    files:
      - label: "Veranstaltungskalender"
        name: "kalender"
        file: "content/termine.json"
        fields:
          - label: "Termine"
            name: "termine"
            widget: "list"
            summary: "{{fields.datum}} – {{fields.veranstaltung}}"
            fields:
              - { label: "Datum",        name: "datum",         widget: "datetime", date_format: "DD.MM.YYYY", time_format: false, hint: "Datum aus Kalender wählen" }
              - { label: "Uhrzeit",      name: "uhrzeit",       widget: "string", hint: "z.B. 18:00 Uhr" }
              - { label: "Veranstaltung",name: "veranstaltung", widget: "string" }
              - { label: "Ort",          name: "ort",           widget: "string" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                options:
                  - "Vorstand"
                  - "Schießwesen"
                  - "Hundeausbildung"
                  - "Jagdhornblasen"
                  - "Jugend"
                  - "Hegering"
                  - "Naturschutz"
                  - "Ausbildung"
                  - "Kreisveranstaltung"
                  - "Hauptversammlung"
                  - "Tradition"

  # ──────────────────────────────────────────
  # AKTUELLES / NEWS
  # ──────────────────────────────────────────
  - name: "aktuelles"
    label: "📰 Aktuelles"
    files:
      - label: "Newsbeiträge"
        name: "news"
        file: "content/aktuelles.json"
        fields:
          - label: "Beiträge"
            name: "beitraege"
            widget: "list"
            summary: "{{fields.titel}} ({{fields.datum}})"
            hint: "➕ Hinzufügen = neuer Beitrag | 🗑️ Löschen = auf den Pfeil klicken, dann Eintrag aufklappen und unten 'Entfernen' drücken, danach Speichern/Veröffentlichen nicht vergessen!"
            fields:
              - { label: "Titel",           name: "titel",     widget: "string" }
              - { label: "Datum",           name: "datum",     widget: "datetime", date_format: "DD. MMMM YYYY", time_format: false, hint: "Datum aus Kalender wählen" }
              - label: "Kategorie"
                name: "kategorie"
                widget: "select"
                options:
                  - "Allgemein"
                  - "Naturschutz"
                  - "Jagd"
                  - "Jungwildrettung"
                  - "Hundeausbildung"
                  - "Schießwesen"
                  - "Jugend"
                  - "Jagdhornblasen"
                  - "Veranstaltung"
                  - "Pressemitteilung"
              - { label: "Bild",            name: "bild",      widget: "image",  required: false }
              - { label: "Kurzbeschreibung",name: "text",      widget: "markdown" }
              - { label: "Link (optional)", name: "link",      widget: "string", required: false }

  # ──────────────────────────────────────────
  # FAQ
  # ──────────────────────────────────────────
  - name: "faq"
    label: "❓ FAQ"
    files:
      - label: "Häufige Fragen"
        name: "faq"
        file: "content/faq.json"
        fields:
          - label: "Kategorien"
            name: "kategorien"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Kategorie-Titel", name: "titel", widget: "string" }
              - label: "Fragen"
                name: "fragen"
                widget: "list"
                summary: "{{fields.frage}}"
                fields:
                  - { label: "Frage", name: "frage",   widget: "string" }
                  - { label: "Antwort", name: "antwort", widget: "text" }

  # ──────────────────────────────────────────
  # KONTAKT & ÖFFNUNGSZEITEN
  # ──────────────────────────────────────────
  - name: "einstellungen"
    label: "⚙️ Kontakt & Öffnungszeiten"
    files:
      - label: "Geschäftsstelle"
        name: "kontakt"
        file: "content/einstellungen.json"
        fields:
          - { label: "Telefon",  name: "telefon", widget: "string" }
          - { label: "E-Mail",   name: "email",   widget: "string" }
          - { label: "Adresse",  name: "adresse", widget: "text",  hint: "Jede Zeile = eine Zeile auf der Website" }
          - label: "Öffnungszeiten"
            name: "oeffnungszeiten"
            widget: "list"
            summary: "{{fields.tage}}: {{fields.zeiten}}"
            fields:
              - { label: "Tag(e)",  name: "tage",   widget: "string", hint: "z.B. Montag & Mittwoch" }
              - { label: "Uhrzeit", name: "zeiten", widget: "string", hint: "z.B. 10:00 – 12:00 Uhr" }
          - { label: "Google Kalender URL", name: "google_kalender_url", widget: "string", required: false, hint: "Einbettungs-URL aus Google Kalender (Einstellungen → Kalender einbetten → src=... URL kopieren). Leer lassen = nicht anzeigen." }
          - { label: "Google Kalender Überschrift", name: "google_kalender_titel", widget: "string", required: false, default: "Terminbuchung", hint: "Titel der über dem Kalender angezeigt wird" }

  # ──────────────────────────────────────────
  # IMPRESSUM
  # ──────────────────────────────────────────
  - name: "impressum"
    label: "📄 Impressum"
    files:
      - label: "Impressum"
        name: "impressum"
        file: "content/impressum.json"
        fields:
          - { label: "Vereinsname",          name: "verein",           widget: "string" }
          - { label: "Adresse",              name: "adresse",          widget: "text",   hint: "Straße, Hausnummer, PLZ Ort" }
          - { label: "Vertreten durch",      name: "vertreten_durch",  widget: "string", hint: "z.B. Klaus Rathje, Kreisjägermeister" }
          - { label: "Telefon",              name: "telefon",          widget: "string" }
          - { label: "E-Mail",               name: "email",            widget: "string" }
          - { label: "Registergericht",      name: "registergericht",  widget: "string" }
          - { label: "Registernummer",       name: "registernummer",   widget: "string" }
          - { label: "Verantwortlich (§18)", name: "verantwortlich",   widget: "text" }

  # ──────────────────────────────────────────
  # DESIGN & FARBEN
  # ──────────────────────────────────────────
  - name: "design"
    label: "🎨 Design & Farben"
    files:
      - label: "Farben & Schriften"
        name: "design"
        file: "content/design.json"
        fields:
          - { label: "Hauptfarbe Grün", name: "farbe_gruen", widget: "string", hint: "Hex-Farbwert z.B. #2e6b30" }
          - { label: "Dunkelgrün (Header/Footer)", name: "farbe_dunkelgruen", widget: "string" }
          - { label: "Akzentfarbe (Gold)", name: "farbe_akzent", widget: "string" }
          - label: "Überschrift-Schrift"
            name: "schrift_ueberschrift"
            widget: "select"
            options:
              - "Playfair Display"
              - "Georgia"
              - "Merriweather"
              - "Lora"
              - "EB Garamond"
          - label: "Text-Schrift"
            name: "schrift_text"
            widget: "select"
            options:
              - "Inter"
              - "Open Sans"
              - "Roboto"
              - "Lato"
              - "Source Sans Pro"
          - { label: "Schriftgröße H1 (Haupttitel)", name: "schriftgroesse_h1", widget: "string", hint: "z.B. 2.8rem oder 44px", required: false }
          - { label: "Schriftgröße H2 (Abschnittstitel)", name: "schriftgroesse_h2", widget: "string", hint: "z.B. 2rem oder 32px", required: false }
          - { label: "Schriftgröße H3 (Unterabschnitt)", name: "schriftgroesse_h3", widget: "string", hint: "z.B. 1.4rem oder 22px", required: false }
          - { label: "Schriftgröße Text (Fließtext)", name: "schriftgroesse_text", widget: "string", hint: "z.B. 1rem oder 16px", required: false }

  # ──────────────────────────────────────────
  # FUSSZEILE
  # ──────────────────────────────────────────
  - name: "footer"
    label: "🦶 Fußzeile"
    files:
      - label: "Fußzeile"
        name: "footer"
        file: "content/footer.json"
        fields:
          - { label: "Über-uns Text", name: "ueber_text", widget: "text" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false, hint: "Leer lassen = kein Link" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "Copyright-Text", name: "copyright", widget: "string" }

  # ──────────────────────────────────────────
  # DOWNLOADS
  # ──────────────────────────────────────────
  - name: "downloads"
    label: "📥 Downloads"
    files:
      - label: "Downloads"
        name: "downloads"
        file: "content/downloads.json"
        fields:
          - { label: "Seitentitel", name: "titel", widget: "string" }
          - { label: "Einleitungstext", name: "intro", widget: "text", required: false }
          - label: "Kategorien"
            name: "kategorien"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Kategorie-Titel", name: "titel", widget: "string" }
              - label: "Downloads"
                name: "downloads"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Dateiname / Titel", name: "name", widget: "string" }
                  - { label: "Beschreibung", name: "beschreibung", widget: "string", required: false }
                  - { label: "Datei hochladen", name: "url", widget: "file", required: false }
                  - label: "Typ"
                    name: "typ"
                    widget: "select"
                    default: "PDF"
                    options: ["PDF", "Word", "Excel", "ZIP", "Sonstiges"]

  # ──────────────────────────────────────────
  # WUNSCHLISTE / AUFGABEN
  # ──────────────────────────────────────────
  - name: "wunschliste"
    label: "📋 Wunschliste & Aufgaben"
    files:
      - label: "Aufgaben & Wünsche"
        name: "aufgaben"
        file: "content/wunschliste.json"
        fields:
          - label: "Aufgaben"
            name: "aufgaben"
            widget: "list"
            summary: "[{{fields.status}}] {{fields.titel}}"
            fields:
              - { label: "Titel / Aufgabe",  name: "titel",        widget: "string" }
              - { label: "Beschreibung",     name: "beschreibung", widget: "text",   required: false }
              - { label: "Bild / Screenshot",name: "bild",         widget: "image",  required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "offen"
                options:
                  - { label: "⏳ Offen",     value: "offen" }
                  - { label: "🔄 In Arbeit", value: "in-arbeit" }
                  - { label: "✅ Erledigt",  value: "erledigt" }

  - name: "extra_navigation"
    label: "🌐 Eigene Hauptpunkte (Navigation)"
    files:
      - label: "Eigene Hauptpunkte"
        name: "navigation_extra"
        file: "content/navigation-extra.json"
        fields:
          - label: "Hauptpunkte"
            name: "hauptpunkte"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Hier kannst du komplett neue Navigationspunkte anlegen, die oben in der Menüleiste erscheinen."
            fields:
              - { label: "Menü-Label (Bezeichnung)", name: "label", widget: "string", hint: "z.B. 'Jagdrecht' oder 'Veranstaltungen'" }
              - label: "Unterseiten"
                name: "seiten"
                widget: "list"
                summary: "{{fields.nav_label}} ({{fields.slug}})"
                hint: "Mindestens eine Seite anlegen. Hat nur eine Seite → direkter Link, mehrere → Dropdown."
                fields:
                  - { label: "Seitentitel",         name: "titel",           widget: "string" }
                  - { label: "Menü-Label",           name: "nav_label",       widget: "string", hint: "Kurzer Text fürs Menü" }
                  - { label: "URL-Kürzel (Slug)",    name: "slug",            widget: "string", hint: "Nur Buchstaben und Bindestriche, z.B. 'jagdrecht-info'" }
                  - { label: "Im Menü anzeigen?",    name: "in_navigation",   widget: "boolean", default: true }
                  - { label: "Veröffentlicht?",      name: "veroeffentlicht", widget: "boolean", default: false }
                  - { label: "Inhalt (Markdown)",    name: "inhalt",          widget: "markdown", required: false }
