<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div class="topbar"><div class="container">
  <div class="topbar__left">
    <span>📧 <a href="mailto:info@kjs-bad-segeberg.de">info@kjs-bad-segeberg.de</a></span>
    <span>📞 <a href="tel:+494551123456">04551 / 12 34 56</a></span>
  </div>
  <div class="topbar__right">
    <div class="topbar__social">
      <a href="#" aria-label="Facebook" title="Facebook" class="topbar__social--facebook"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg></a>
      <a href="#" aria-label="Instagram" title="Instagram" class="topbar__social--instagram"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg></a>
    </div>
  </div>

</div></div>
<header class="site-header">
  <div class="container header-inner">
    <a href="./index.html" class="site-logo">
      <img src="images/logo.png" alt="KJS Segeberg Logo" style="height:76px;width:auto;">
      <div class="site-logo__text">
        <span class="site-logo__name">Kreisjägerschaft</span>
        <span class="site-logo__sub">Segeberg <span class="no-caps">e.V.</span></span>
      </div>
    </a>
    <nav aria-label="Hauptnavigation">
      <ul class="main-nav" id="mainNav"></ul>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Menü öffnen"><span></span><span></span><span></span></button>
  </div>
</header>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile Navigation">
  <button class="mobile-nav__close" id="mobileNavClose" aria-label="Menü schließen">✕</button>
  <ul id="mobileNavList"></ul>
</nav>
<div class="page-hero">
  <div class="container"><h1>Impressum</h1>
  <nav class="breadcrumb"><a href="index.html">Startseite</a><span class="sep">/</span><span>Impressum</span></nav>
  </div>
</div>
<div class="page-content full">
  <div class="container">
    <main class="main-content" style="max-width:720px;" id="impressum-content">
      <p style="color:var(--text-muted);">Wird geladen …</p>
    </main>
    <script>
      // Kontaktdaten (Adresse/Postadresse/Telefon/E-Mail) kommen seit dem
      // 22.08.2026 zentral aus content/einstellungen.json (Admin-Bereich
      // "Kontakt & Stammdaten") statt als eigene Felder in impressum.json zu
      // liegen - vorher liefen diese beiden Dateien auseinander, sobald nur
      // eine Stelle aktualisiert wurde.
      Promise.all([
        fetch('content/impressum.json').then(r => r.json()),
        fetch('content/einstellungen.json').then(r => r.json())
      ]).then(([d, k]) => {
          document.getElementById('impressum-content').innerHTML = `
            <h2>Angaben gemäß § 5 TMG</h2>
            <p><strong>${d.verein}</strong><br>${(k.adresse || '').replace(/\n/g,'<br>')}</p>
            ${k.postadresse ? `<p><strong>Postadresse:</strong><br>${k.postadresse.replace(/\n/g,'<br>')}</p>` : ''}
            <p><strong>Vertreten durch:</strong><br>${d.vertreten_durch}</p>
            <h3>Kontakt</h3>
            <p>Telefon: <a href="tel:${(k.telefon || '').replace(/\s|-|\//g,'')}">${k.telefon}</a><br>
            E-Mail: <a href="mailto:${k.email}">${k.email}</a></p>
            <h3>Registereintrag</h3>
            <p>Eingetragen im Vereinsregister.<br>
            Registergericht: ${d.registergericht}<br>
            Registernummer: ${d.registernummer}</p>
            <h3>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h3>
            <p>${d.verantwortlich.replace(/\n/g,'<br>')}</p>
            <h3>Haftungsausschluss</h3>
            <p>Die Inhalte dieser Website wurden mit größter Sorgfalt erstellt. Für die Richtigkeit,
               Vollständigkeit und Aktualität der Inhalte können wir jedoch keine Gewähr übernehmen.</p>
            <h3>Urheberrecht</h3>
            <p>Die durch die Seitenbetreiber erstellten Inhalte und Werke auf diesen Seiten unterliegen
               dem deutschen Urheberrecht. Die Vervielfältigung, Bearbeitung und Verbreitung bedürfen
               der schriftlichen Zustimmung des jeweiligen Autors bzw. Erstellers.</p>`;
        });
    </script>
  </div>
</div>
<footer class="site-footer"><div class="container">
  <div class="footer-bottom">
    <span>Copyright 2026 © Kreisjägerschaft Segeberg e.V.</span>
    <div class="footer-bottom__links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="/admin/" class="admin-login-link" target="_blank" rel="noopener noreferrer">Login</a></div>
  </div>
</div></footer>
<script src="js/main.js"></script>
<script>
  fetch('/content/footer.json').then(r=>r.json()).then(d=>{
    const ft = document.querySelector('.footer-about p');
    if(ft && d.ueber_text) ft.textContent = d.ueber_text;
    const cp = document.querySelector('.footer-bottom span');
    if(cp && d.copyright) cp.textContent = d.copyright;
    const fbLink = document.querySelector('.footer-social a[aria-label="Facebook"]');
    if(fbLink && d.facebook_url) fbLink.href = d.facebook_url;
    const igLink = document.querySelector('.footer-social a[aria-label="Instagram"]');
    if(igLink && d.instagram_url) igLink.href = d.instagram_url;
    const fbLinkTop = document.querySelector('.topbar__social a[aria-label="Facebook"]');
    if(fbLinkTop && d.facebook_url) fbLinkTop.href = d.facebook_url;
    const igLinkTop = document.querySelector('.topbar__social a[aria-label="Instagram"]');
    if(igLinkTop && d.instagram_url) igLinkTop.href = d.instagram_url;
  }).catch(()=>{});
</script>
</body>
</html>
