<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div id="siteHeader"></div>
<script src="/js/components.js"></script>
<div class="page-hero">
  <div class="container"><h1>Impressum</h1>
  <nav class="breadcrumb" aria-label="Breadcrumb" id="siteBreadcrumb"></nav>
  </div>
</div>
<div class="page-content full">
  <div class="container">
    <main class="main-content" style="max-width:720px;" id="impressum-content">
      <p style="color:var(--text-muted);">Wird geladen …</p>
    </main>
    <script>
      // Kontaktdaten (Adresse/Postadresse/Telefon/E-Mail) kommen seit dem
      // 22.08.2026 zentral aus content/einstellungen.json (Admin-Bereich
      // "Kontakt & Stammdaten") statt als eigene Felder in impressum.json zu
      // liegen - vorher liefen diese beiden Dateien auseinander, sobald nur
      // eine Stelle aktualisiert wurde.
      Promise.all([
        fetch('content/impressum.json').then(r => r.json()),
        fetch('content/einstellungen.json').then(r => r.json())
      ]).then(([d, k]) => {
          document.getElementById('impressum-content').innerHTML = `
            <h2>Angaben gemäß § 5 TMG</h2>
            <p><strong>${d.verein}</strong><br>${(k.adresse || '').replace(/\n/g,'<br>')}</p>
            ${k.postadresse ? `<p><strong>Postadresse:</strong><br>${k.postadresse.replace(/\n/g,'<br>')}</p>` : ''}
            <p><strong>Vertreten durch:</strong><br>${d.vertreten_durch}</p>
            <h3>Kontakt</h3>
            <p>Telefon: <a href="tel:${(k.telefon || '').replace(/\s|-|\//g,'')}">${k.telefon}</a><br>
            E-Mail: <a href="mailto:${k.email}">${k.email}</a></p>
            <h3>Registereintrag</h3>
            <p>Eingetragen im Vereinsregister.<br>
            Registergericht: ${d.registergericht}<br>
            Registernummer: ${d.registernummer}</p>
            <h3>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h3>
            <p>${d.verantwortlich.replace(/\n/g,'<br>')}</p>
            <h3>Haftungsausschluss</h3>
            <p>Die Inhalte dieser Website wurden mit größter Sorgfalt erstellt. Für die Richtigkeit,
               Vollständigkeit und Aktualität der Inhalte können wir jedoch keine Gewähr übernehmen.</p>
            <h3>Urheberrecht</h3>
            <p>Die durch die Seitenbetreiber erstellten Inhalte und Werke auf diesen Seiten unterliegen
               dem deutschen Urheberrecht. Die Vervielfältigung, Bearbeitung und Verbreitung bedürfen
               der schriftlichen Zustimmung des jeweiligen Autors bzw. Erstellers.</p>`;
        });
    </script>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="/js/main.js"></script>
</body>
</html>
