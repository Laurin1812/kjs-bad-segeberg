<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Über uns – Kreisjägerschaft Segeberg e.V.">
  <title>Über uns – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div id="siteHeader"></div>
<script src="/js/components.js"></script>
<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1 id="page-title">Über uns</h1>
    <nav class="breadcrumb"><a href="../index.html">Startseite</a><span class="sep">/</span><span>Jäger</span><span class="sep">/</span><span>Über uns</span></nav>
  </div>
</div>
<div class="page-content">
  <div class="container">
    <main class="main-content" id="page-inhalt">
      <div class="loading-spinner">Lädt...</div>
    </main>
    <script>
      fetch('../content/jaeger/ueber-uns.json').then(r=>r.json()).then(d=>{
        if(d.hero_bild){ var bg=document.querySelector('.page-hero__bg'); if(bg) bg.style.backgroundImage="url('"+d.hero_bild+"')"; }
        if(d.titel){ document.title = d.titel + ' – Kreisjägerschaft Segeberg e.V.'; document.getElementById('page-title').textContent = d.titel; }
        if (Array.isArray(d.linkliste) && d.linkliste.length) {
          const lnNav = document.getElementById('linkliste-nav');
          const lnWidget = document.getElementById('linkliste-widget');
          const lnTitelEl = document.getElementById('linkliste-titel');
          if (lnTitelEl && d.linkliste_titel) lnTitelEl.textContent = d.linkliste_titel;
          const stTitelEl = document.getElementById('sub-seiten-titel');
          if (stTitelEl && d.unterseiten_titel) stTitelEl.textContent = d.unterseiten_titel;
          if (lnNav && lnWidget) {
            d.linkliste.forEach(l => {
              if (!l || !l.url) return;
              const li = document.createElement('li');
              const externLink = /^https?:\/\//i.test(l.url);
              li.innerHTML = '<a href="' + l.url + '"' + (externLink ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + (l.titel || l.url) + '</a>';
              lnNav.appendChild(li);
            });
            lnWidget.style.display = '';
          }
        }
        const bild = d.bild ? `<img src="${d.bild}" alt="${d.bild_alt||''}" class="${(d.bild_groesse&&d.bild_groesse.indexOf('img-')===0)?d.bild_groesse:(d.bild_groesse==='klein'?'img-25':d.bild_groesse==='mittel'?'img-50':'img-100')}" style="border-radius:8px;margin-bottom:1.5rem;" onerror="this.style.display='none'">` : '';
        let inhalt = '';
        if(d.inhalt){ inhalt = typeof marked !== 'undefined' ? (/<[a-z][\s\S]*>/i.test(d.inhalt) ? d.inhalt : marked.parse(d.inhalt)) : '<p>' + d.inhalt.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>'; }
        document.getElementById('page-inhalt').innerHTML =
          (d.untertitel ? '<h2>' + d.untertitel + '</h2>' : '') +
          (d.intro ? '<p>' + d.intro + '</p>' : '') +
          bild +
          (inhalt ? '<div>' + inhalt + '</div>' : '') ||
          '<p>Inhalt wird gerade bearbeitet.</p>';
      }).catch(()=>{
        document.getElementById('page-inhalt').innerHTML = '<p>Inhalt konnte nicht geladen werden.</p>';
      });
    </script>
    <aside class="sidebar">
      <div class="sidebar-widget sidebar-widget--highlight" id="linkliste-widget" style="display:none;">
        <h4 id="linkliste-titel">Weiterführende Links</h4>
        <ul class="sidebar-nav" id="linkliste-nav"></ul>
      </div>
      <div class="sidebar-widget" id="sub-seiten-widget" style="display:none;">
        <h4 id="sub-seiten-titel">Unterseiten zu Über uns</h4>
        <ul class="unterseiten-tiles" id="sub-seiten-nav"></ul>
        <script>
          fetch('/content/seiten-sub-ueber-uns.json').then(function(r){return r.json();}).then(function(d){
            var nav = document.getElementById('sub-seiten-nav');
            var widget = document.getElementById('sub-seiten-widget');
            if (!nav) return;
            var seiten = (d.seiten || []).filter(function(s) { return s.veroeffentlicht !== false && s.in_navigation !== false; });
            if (!seiten.length) return;
            seiten.forEach(function(s) {
              var li = document.createElement('li');
              li.innerHTML = '<a class="unterseite-tile" href="../seiten/index.html?s=' + encodeURIComponent(s.slug) + '">' +
                '<span class="unterseite-tile__icon">📄</span>' +
                '<span class="unterseite-tile__label">' + (s.nav_label || s.slug) + '</span>' +
              '</a>';
              nav.appendChild(li);
            });
            widget.style.display = '';
          }).catch(function(){});
        </script>
      </div>
      <div class="sidebar-widget">
        <h4>Jäger</h4>
        <ul class="sidebar-nav" data-related-nav></ul>
      </div>
      <div class="contact-box">
        <h4>Geschäftsstelle</h4>
        <p>📧 <a href="mailto:info@kjs-bad-segeberg.de">info@kjs-bad-segeberg.de</a></p>
        <p>📞 <a href="tel:+494551123456">04551 / 12 34 56</a></p>
      </div>
    </aside>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
