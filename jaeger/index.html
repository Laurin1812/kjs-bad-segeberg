<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jäger – Kreisjägerschaft Segeberg e.V.">
  <title>Jäger – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div id="siteHeader"></div>
<script src="/js/components.js"></script>
<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1>Jäger & KJS Segeberg</h1>
    <nav class="breadcrumb"><a href="../index.html">Startseite</a><span class="sep">/</span><span>Jäger</span></nav>
  </div>
</div>
<div class="page-content full">
  <div class="container">
    <main class="main-content" id="page-main">
      <div class="loading-spinner">Lädt...</div>
    </main>
    <script>
      fetch('../content/jaeger/uebersicht.json').then(r=>r.json()).then(d=>{
        if(d.hero_bild){ var bg=document.querySelector('.page-hero__bg'); if(bg) bg.style.backgroundImage="url('"+d.hero_bild+"')"; }
        const bild = d.bild ? `<img src="${d.bild}" alt="${d.bild_alt||''}" class="${(d.bild_groesse&&d.bild_groesse.indexOf('img-')===0)?d.bild_groesse:(d.bild_groesse==='klein'?'img-25':d.bild_groesse==='mittel'?'img-50':'img-100')}" style="border-radius:8px;margin-bottom:1.5rem;">` : '';
        let inhalt = '';
        if(d.inhalt){ inhalt = typeof marked !== 'undefined' ? (/<[a-z][\s\S]*>/i.test(d.inhalt) ? d.inhalt : marked.parse(d.inhalt)) : '<p>' + d.inhalt.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>'; }
        const kontakt = (d.kontakt_name||d.kontakt_email) ? `<p style="margin-top:1rem;"><strong>Kontakt:</strong> ${d.kontakt_name||''}${d.kontakt_email?' &middot; <a href="mailto:'+d.kontakt_email+'">'+d.kontakt_email+'</a>':''}</p>` : '';
        document.getElementById('page-main').innerHTML = `
          <h2>${d.untertitel||''}</h2>
          <p>${d.intro||''}</p>
          ${bild}
          ${inhalt ? '<div>' + inhalt + '</div>' : ''}
          ${kontakt}
          <div class="grid-3" style="margin: 2.5rem 0;">
            <a href="vorstand.html" class="service-card">
              <div class="service-card__img-wrap"><img class="service-card__img" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&q=70" alt="Vorstand" loading="lazy"></div>
              <div class="service-card__body">
                <div class="service-card__icon">👥</div>
                <div class="service-card__title">Vorstand</div>
                <p class="service-card__text">Unser ehrenamtlicher Vorstand – Ihre Ansprechpartner für alle jagdlichen Fragen.</p>
                <span class="read-more">Mehr lesen</span>
              </div>
            </a>
            <a href="hegeringe.html" class="service-card">
              <div class="service-card__img-wrap"><img class="service-card__img" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=70" alt="Hegeringe" loading="lazy"></div>
              <div class="service-card__body">
                <div class="service-card__icon">🗺️</div>
                <div class="service-card__title">Hegeringe</div>
                <p class="service-card__text">12 Hegeringe im Kreis Bad Segeberg – Ihr regionaler Ansprechpartner vor Ort.</p>
                <span class="read-more">Mehr lesen</span>
              </div>
            </a>
            <a href="obleute.html" class="service-card">
              <div class="service-card__img-wrap"><img class="service-card__img" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&q=70" alt="Obleute" loading="lazy"></div>
              <div class="service-card__body">
                <div class="service-card__icon">📋</div>
                <div class="service-card__title">Obleute</div>
                <p class="service-card__text">Fachbeauftragte für Schießwesen, Hundeausbildung, Jugend, Naturschutz und mehr.</p>
                <span class="read-more">Mehr lesen</span>
              </div>
            </a>
            <a href="mitglied-werden.html" class="service-card">
              <div class="service-card__img-wrap"><img class="service-card__img" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&q=70" alt="Mitglied werden" loading="lazy"></div>
              <div class="service-card__body">
                <div class="service-card__icon">🤝</div>
                <div class="service-card__title">Mitglied werden</div>
                <p class="service-card__text">Aktiv oder als Fördermitglied – werden Sie Teil unserer Gemeinschaft.</p>
                <span class="read-more">Mehr lesen</span>
              </div>
            </a>
            <a href="jaeger-werden.html" class="service-card">
              <div class="service-card__img-wrap"><img class="service-card__img" src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=600&q=70" alt="Jäger werden" loading="lazy"></div>
              <div class="service-card__body">
                <div class="service-card__icon">🎯</div>
                <div class="service-card__title">Jäger/in werden</div>
                <p class="service-card__text">Alles zum Jagdschein, der Ausbildung und dem Einstieg in die Jagd.</p>
                <span class="read-more">Mehr lesen</span>
              </div>
            </a>
            <a href="../kreisjjaegermeister/index.html" class="service-card">
              <div class="service-card__img-wrap"><img class="service-card__img" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&q=70" alt="Kreisjägermeister" loading="lazy"></div>
              <div class="service-card__body">
                <div class="service-card__icon">🏛️</div>
                <div class="service-card__title">Kreisjägermeister</div>
                <p class="service-card__text">Der Kreisjägermeister – höchstes Amt der KJS Segeberg.</p>
                <span class="read-more">Mehr lesen</span>
              </div>
            </a>
          </div>
        `;
      }).catch(()=>{
        document.getElementById('page-main').innerHTML = '<p>Inhalt konnte nicht geladen werden.</p>';
      });
    </script>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
