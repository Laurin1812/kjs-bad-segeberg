<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Infomobil – Kreisjägerschaft Segeberg e.V.">
  <title>Infomobil – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div id="siteHeader"></div>
<script src="/js/components.js"></script>

<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1>Infomobil</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb" id="siteBreadcrumb"></nav>
  </div>
</div>

<div class="page-content">
  <div class="container">
    <main class="main-content" id="page-main">
      <div class="loading-spinner">Lädt...</div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-widget">
        <h4>Jäger</h4>
        <ul class="sidebar-nav" data-related-nav></ul>
      </div>
      <div class="contact-box">
        <h4>Kontakt</h4>
        <p>📧 <a href="mailto:info@kjs-bad-segeberg.de">info@kjs-bad-segeberg.de</a></p>
        <p>📞 <a href="tel:+494551123456">04551 / 12 34 56</a></p>
      </div>
    </aside>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>

<script src="/js/main.js"></script>
<script>
  // Infomobil-Inhalt laden + Markdown rendern + optional Google Kalender
  fetch('/content/jaeger/infomobil.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var main = document.getElementById('page-main');
      if (!main) return;
      if (d.hero_bild) {
        var bg = document.querySelector('.page-hero__bg');
        if (bg) bg.style.backgroundImage = "url('" + d.hero_bild + "')";
      }
      // Inhaltsbild-Größe als CSS-Klasse (img-25/50/75/100, gleiche
      // Konvention wie Inline-Bilder). Alte Werte klein/mittel/gross werden
      // auf das neue Schema gemappt.
      function bildGroesseClass(v) {
        if (v && v.indexOf('img-') === 0) return v;
        if (v === 'klein')  return 'img-25';
        if (v === 'mittel') return 'img-50';
        return 'img-100';
      }
      var bild = d.bild
        ? '<img src="' + d.bild + '" alt="' + (d.bild_alt || '') + '" class="' + bildGroesseClass(d.bild_groesse) + '" style="border-radius:8px;margin-bottom:1.5rem;">'
        : '';
      var kontaktStr = '';
      if (d.kontakt_name || d.kontakt_email) {
        kontaktStr = '<p><strong>Kontakt:</strong> ' + (d.kontakt_name || '');
        if (d.kontakt_email) kontaktStr += ' &middot; <a href="mailto:' + d.kontakt_email + '">' + d.kontakt_email + '</a>';
        kontaktStr += '</p>';
      }
      // untertitel / intro / inhalt werden vom Admin als HTML gespeichert
      // und hier direkt via innerHTML gerendert (kein marked.parse mehr nötig).
      // Alte Einträge die noch Markdown enthalten: marked ist auf dieser Seite
      // geladen – falls kein HTML-Tag erkannt wird, wird Markdown konvertiert.
      function renderField(raw) {
        if (!raw) return '';
        if (/<[a-z]/i.test(raw)) return raw;
        return typeof marked !== 'undefined' ? marked.parse(raw) : raw;
      }
      main.innerHTML =
        renderField(d.untertitel) +
        renderField(d.intro) +
        bild +
        '<div id="page-inhalt"></div>' +
        kontaktStr +
        '<div id="kalender-container"></div>' +
        '<div style="margin-top:2rem;"><a href="../kontakt/index.html" class="btn btn-outline-green">Kontakt aufnehmen</a></div>';
      if (d.inhalt) {
        var el = document.getElementById('page-inhalt');
        if (el) el.innerHTML = renderField(d.inhalt);
      }
      // Google Kalender nach Seiteninhalt einfügen
      return fetch('/content/einstellungen.json');
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var container = document.getElementById('kalender-container');
      if (!container || !d.google_kalender_url) return;
      var titel = d.google_kalender_titel || 'Terminbuchung';
      container.innerHTML =
        '<div style="margin-top:2rem;">' +
          '<h3 style="margin-bottom:1rem;">' + titel + '</h3>' +
          '<div style="border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md);">' +
            '<iframe src="' + d.google_kalender_url + '" style="width:100%;height:650px;border:none;display:block;" frameborder="0" scrolling="no" title="Google Kalender – Terminbuchung"></iframe>' +
          '</div>' +
          '<p style="font-size:.8rem;color:var(--text-muted);margin-top:.75rem;">Dieser Kalender wird von Google bereitgestellt. ' +
            '<a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Datenschutzhinweise von Google</a></p>' +
        '</div>';
    })
    .catch(function() {});
</script>
</body>
</html>
