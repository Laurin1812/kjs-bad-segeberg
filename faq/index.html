<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Häufige Fragen zur Kreisjägerschaft Segeberg e.V.">
  <title>FAQ – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>

<div id="siteHeader"></div>
<script src="/js/components.js"></script>

<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1>FAQ – Häufige Fragen</h1>
    <nav class="breadcrumb">
      <a href="../index.html">Startseite</a><span class="sep">/</span><span>FAQ</span>
    </nav>
  </div>
</div>

<div class="page-content full">
  <div class="container">
    <main class="main-content">
      <h2>Antworten auf häufige Fragen</h2>
      <p style="color:var(--text-muted); margin-bottom:2.5rem;">
        Hier haben wir die häufigsten Fragen rund um Jagd, Mitgliedschaft und unsere
        Kreisjägerschaft für Sie zusammengestellt.
      </p>

      <div id="faq-content"><p style="color:var(--text-muted);">Wird geladen …</p></div>

      <script>
        fetch('../content/faq.json')
          .then(r => r.json())
          .then(data => {
            var html = data.kategorien.map(kat => `
              <h3 style="color:var(--green-dark);margin:2rem 0 1.25rem;">${kat.titel}</h3>
              <div class="faq-list">
                ${kat.fragen.map(f => `
                  <details class="faq-item">
                    <summary>${f.frage}</summary>
                    <div class="faq-item__body">${f.antwort}</div>
                  </details>`).join('')}
              </div>`).join('');
            html += `
              <div style="margin-top:2.5rem;padding:1.75rem;background:var(--green-light);border-radius:var(--radius-md);text-align:center;">
                <h3 style="color:var(--green-dark);margin-bottom:.75rem;">Keine Antwort gefunden?</h3>
                <p style="margin-bottom:1.25rem;color:var(--text-muted);">Wir helfen gerne weiter. Schreiben Sie uns einfach eine Nachricht.</p>
                <a href="../kontakt/index.html" class="btn btn-primary">Jetzt Kontakt aufnehmen</a>
              </div>`;
            document.getElementById('faq-content').innerHTML = html;
          });
      </script>
    </main>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="/js/main.js"></script>
</body>
</html>
