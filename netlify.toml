[build]
  publish = "."
  command = ""
  # Netlify-Deploy überspringen wenn sich nur content/*.json geändert hat.
  # JSON-Inhalte werden direkt vom GitHub-CDN geladen (main.js-Umleitung),
  # ein Netlify-Deploy ist dafür nicht nötig → kein Credit-Verbrauch beim Speichern im Admin.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)content'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
