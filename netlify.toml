[build]
  publish = "."
  command = ""
  # Jeder Commit (auch reine content/*.json-Änderungen aus dem Admin) löst
  # einen Netlify-Redeploy aus. content/*.json wird direkt von Netlify
  # ausgeliefert (relative Pfade, siehe js/main.js), daher muss jede
  # Admin-Speicherung deployed werden, um sofort live zu sein.

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    # Ohne diese Zeile lieferte Netlify admin.js/admin.css mit Standard-Caching
    # aus - dadurch kam wiederholt eine veraltete admin.js aus dem Browser-
    # Cache, obwohl längst ein neuer Stand deployed war. Speichern aus einem
    # alten Tab hat dadurch neue Formularfelder geleert bzw. alte Fallback-
    # Logik erneut ausgelöst. Gleiche Regel wie /css/* und /js/*.
    Cache-Control = "no-cache, must-revalidate"

# Browser dazu zwingen, css/js/html immer beim Server zu prüfen (Revalidierung
# über ETag), statt sie unbegrenzt im Cache zu behalten. Damit greifen
# Änderungen (z.B. neue Navigations-Reihenfolge, Dropdown-Fixes) für alle
# Nutzer sofort und nicht erst nach manuellem Cache-Leeren.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
