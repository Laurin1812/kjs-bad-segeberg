<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontakt zur Kreisjägerschaft Segeberg e.V.">
  <title>Kontakt – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>

<div id="siteHeader"></div>
<script src="/js/components.js"></script>

<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1>Kontakt</h1>
    <nav class="breadcrumb">
      <a href="../index.html">Startseite</a><span class="sep">/</span><span>Kontakt</span>
    </nav>
  </div>
</div>

<div class="page-content full">
  <div class="container">
    <main class="main-content">
      <h2 id="kontakt-ueberschrift">So erreichen Sie uns</h2>
      <p id="kontakt-text" style="color:var(--text-muted); margin-bottom:2.5rem;">
        Haben Sie Fragen, Anregungen oder möchten Sie Mitglied werden?
        Nehmen Sie gerne Kontakt mit uns auf – wir freuen uns auf Ihre Nachricht.
      </p>

      <div class="kontakt-grid">
        <!-- FORM -->
        <div class="kontakt-form">
          <h3>Nachricht senden</h3>
          <form id="contactForm" novalidate>
            <input type="hidden" name="_subject" value="Neue Kontaktanfrage – KJS Segeberg">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" style="display:none;" tabindex="-1" autocomplete="off">
            <div class="form-grid-2">
              <div class="form-group">
                <label for="vorname">Vorname *</label>
                <input type="text" id="vorname" name="vorname" placeholder="Max" required>
              </div>
              <div class="form-group">
                <label for="nachname">Nachname *</label>
                <input type="text" id="nachname" name="nachname" placeholder="Mustermann" required>
              </div>
            </div>
            <div class="form-group">
              <label for="email">E-Mail-Adresse *</label>
              <input type="email" id="email" name="email" placeholder="max@beispiel.de" required>
            </div>
            <div class="form-group">
              <label for="telefon">Telefon (optional)</label>
              <input type="tel" id="telefon" name="telefon" placeholder="04551 / ...">
            </div>
            <div class="form-group">
              <label>Sind Sie bereits Jäger/in? *</label>
              <div style="display:flex; gap:1.5rem; margin-top:.4rem;">
                <label style="font-weight:400; display:flex; align-items:center; gap:.4rem;">
                  <input type="radio" name="bereits_jaeger" value="Ja" required style="width:auto;" id="bereits-jaeger-ja"> Ja
                </label>
                <label style="font-weight:400; display:flex; align-items:center; gap:.4rem;">
                  <input type="radio" name="bereits_jaeger" value="Nein" required style="width:auto;" id="bereits-jaeger-nein"> Nein
                </label>
              </div>
            </div>
            <div class="form-group" id="hegering-group" style="display:none;">
              <label for="hegering">Ihr Hegering</label>
              <select id="hegering" name="hegering">
                <option value="">Bitte wählen …</option>
              </select>
            </div>
            <div class="form-group">
              <label for="betreff">Betreff *</label>
              <select id="betreff" name="betreff" required>
                <option value="">Bitte wählen …</option>
                <option>Allgemeine Anfrage</option>
                <option>Mitgliedschaft</option>
                <option>Jägerausbildung (Jagdschein)</option>
                <option>Schießwesen</option>
                <option>Hundeausbildung</option>
                <option>Jagdhornblasen</option>
                <option>Naturschutz</option>
                <option>Jungwildrettung</option>
                <option>Pressenanfrage</option>
                <option>Sonstiges</option>
              </select>
            </div>
            <div class="form-group">
              <label for="nachricht">Ihre Nachricht *</label>
              <textarea id="nachricht" name="nachricht" placeholder="Ihre Nachricht an die KJS Segeberg …" required></textarea>
            </div>
            <div class="form-group" style="display:flex; align-items:flex-start; gap:.75rem;">
              <input type="checkbox" id="datenschutz" name="datenschutz" required style="width:auto; margin-top:.2rem;">
              <label for="datenschutz" style="font-size:.84rem; font-weight:400; color:var(--text-muted);">
                Ich habe die <a href="../datenschutz.html">Datenschutzerklärung</a> gelesen und akzeptiere sie.
              </label>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
              Nachricht senden
            </button>
          </form>
          <script>
            (function() {
              var hegeringGroup = document.getElementById('hegering-group');
              var hegeringSelect = document.getElementById('hegering');
              var radios = document.querySelectorAll('input[name="bereits_jaeger"]');
              var loaded = false;

              function toggleHegering() {
                var ja = document.getElementById('bereits-jaeger-ja').checked;
                hegeringGroup.style.display = ja ? '' : 'none';
                if (ja && !loaded) {
                  loaded = true;
                  fetch('../content/hegeringe.json')
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                      (d.hegeringe || []).forEach(function(h) {
                        var opt = document.createElement('option');
                        opt.value = (h.nummer || '') + (h.name ? ' – ' + h.name : '');
                        opt.textContent = opt.value;
                        hegeringSelect.appendChild(opt);
                      });
                    })
                    .catch(function() {});
                }
                if (!ja) hegeringSelect.value = '';
              }

              radios.forEach(function(r) { r.addEventListener('change', toggleHegering); });
            })();
          </script>
        </div>

        <!-- INFO – dynamisch aus content/einstellungen.json -->
        <div class="kontakt-info" id="kontakt-info">
          <h3>Geschäftsstelle</h3>
          <p style="color:var(--text-muted);">Daten werden geladen …</p>
        </div>

        <script>
          const KONTAKT_ICONS = {
            home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7"/><path d="M9 22V12h6v10"/><path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"/></svg>',
            pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
            phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
            mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
            clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
          };

          // Zieht aus dem freien Postadresse-Text eine "Tel: ..."- und
          // "E-Mail: ..."-Zeile heraus (case-insensitive, auch "Telefon:"),
          // damit sie separat als klickbare Icon-Zeile angezeigt werden können,
          // statt als reiner Fließtext in der Postadresse selbst zu stehen.
          function splitPostadresse(raw) {
            var telefon = '', email = '';
            var lines = (raw || '').split('\n').filter(function(line) {
              var telMatch = line.match(/^\s*tel(?:efon)?\s*[:.]?\s*(.+)$/i);
              if (telMatch) { telefon = telMatch[1].trim(); return false; }
              var mailMatch = line.match(/^\s*e-?mail\s*[:.]?\s*(.+)$/i);
              if (mailMatch) { email = mailMatch[1].trim(); return false; }
              return true;
            });
            return { text: lines.join('\n'), telefon: telefon, email: email };
          }

          fetch('../content/einstellungen.json')
            .then(r => r.json())
            .then(d => {
              if (d.kontakt_ueberschrift) document.getElementById('kontakt-ueberschrift').textContent = d.kontakt_ueberschrift;
              if (d.kontakt_text) document.getElementById('kontakt-text').textContent = d.kontakt_text;

              const adresseHtml = d.adresse
                ? d.adresse.replace(/\n/g, '<br>')
                : '';

              // Postadresse (Frank persönlich): Telefon/E-Mail sollen als eigene,
              // klickbare Icon-Zeilen erscheinen – genau wie bei der Geschäftsstelle
              // oben. Bevorzugt werden die dedizierten Admin-Felder postadresse_telefon/
              // postadresse_email; ist das Feld leer, wird automatisch aus dem
              // Postadresse-Fließtext eine Zeile "Tel: ..." bzw. "E-Mail: ..."
              // herausgelöst (self-migrierend, kein manuelles Nacharbeiten im Admin
              // nötig, bis Frank die neuen Felder separat pflegt).
              const postadresseSplit = splitPostadresse(d.postadresse || '');
              const postadresseHtml = postadresseSplit.text.replace(/\n/g, '<br>');
              const postadresseTelefon = d.postadresse_telefon || postadresseSplit.telefon;
              const postadresseEmail   = d.postadresse_email   || postadresseSplit.email;

              const ozeiten = (d.oeffnungszeiten || [])
                .map(o => `${o.tage}${o.zeiten ? ': ' + o.zeiten : ''}`)
                .join('<br>');

              document.getElementById('kontakt-info').innerHTML = `
                <h3>Geschäftsstelle</h3>

                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.home}</div>
                  <div>
                    <span class="kontakt-detail__label">Adresse</span>
                    <div class="kontakt-detail__value">${adresseHtml}</div>
                  </div>
                </div>

                ${d.telefon ? `
                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.phone}</div>
                  <div>
                    <span class="kontakt-detail__label">Telefon</span>
                    <div class="kontakt-detail__value">
                      <a href="tel:${d.telefon.replace(/\s|\/|\./g,'')}">${d.telefon}</a>
                    </div>
                  </div>
                </div>` : ''}

                ${d.email ? `
                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.mail}</div>
                  <div>
                    <span class="kontakt-detail__label">E-Mail</span>
                    <div class="kontakt-detail__value">
                      <a href="mailto:${d.email}">${d.email}</a>
                    </div>
                  </div>
                </div>` : ''}

                ${postadresseHtml ? `
                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.pin}</div>
                  <div>
                    <span class="kontakt-detail__label">Postadresse</span>
                    <div class="kontakt-detail__value">${postadresseHtml}</div>
                  </div>
                </div>` : ''}

                ${postadresseTelefon ? `
                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.phone}</div>
                  <div>
                    <span class="kontakt-detail__label">Telefon</span>
                    <div class="kontakt-detail__value">
                      <a href="tel:${postadresseTelefon.replace(/\s|\/|\./g,'')}">${postadresseTelefon}</a>
                    </div>
                  </div>
                </div>` : ''}

                ${postadresseEmail ? `
                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.mail}</div>
                  <div>
                    <span class="kontakt-detail__label">E-Mail</span>
                    <div class="kontakt-detail__value">
                      <a href="mailto:${postadresseEmail}">${postadresseEmail}</a>
                    </div>
                  </div>
                </div>` : ''}

                ${ozeiten ? `
                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.clock}</div>
                  <div>
                    <span class="kontakt-detail__label">Sprechzeiten</span>
                    <div class="kontakt-detail__value">${ozeiten}</div>
                  </div>
                </div>` : ''}

                <div class="kontakt-detail">
                  <div class="kontakt-detail__icon">${KONTAKT_ICONS.user}</div>
                  <div>
                    <span class="kontakt-detail__label">Kreisjägermeister</span>
                    <div class="kontakt-detail__value">
                      <a href="../kreisjjaegermeister/index.html">Zur Seite des Kreisjägemeisters →</a>
                    </div>
                  </div>
                </div>

                <div style="margin-top:1.5rem; border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-sm);">
                  <iframe
                    src="https://maps.google.com/maps?q=Am+Schie%C3%9Fstand+1%2C+24640+Hasenmoor&output=embed&z=15&hl=de"
                    width="100%" height="280" style="border:0;display:block;"
                    allowfullscreen="" loading="lazy"
                    title="Standort Kreisjägerschaft Segeberg"></iframe>
                </div>`;
            })
            .catch(() => {
              document.getElementById('kontakt-info').innerHTML += '<p>Kontaktdaten konnten nicht geladen werden.</p>';
            });
        </script>
      </div>
    </main>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="/js/main.js"></script>
</body>
</html>
