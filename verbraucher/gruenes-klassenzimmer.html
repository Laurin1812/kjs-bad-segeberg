<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grünes Klassenzimmer – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div id="siteHeader"></div>
<script src="/js/components.js"></script>
<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1 id="page-titel">🏫 Grünes Klassenzimmer</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb" id="siteBreadcrumb"></nav>
  </div>
</div>
<div class="page-content">
  <div class="container">
    <main class="main-content" id="page-main">
      <div class="loading-spinner">Lädt...</div>
    </main>
    <script>
      fetch('/content/verbraucher/gruenes-klassenzimmer.json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var main = document.getElementById('page-main');
          if (!main) return;
          // Titel/H1 jetzt aus dem Admin-Feld statt fest im HTML (22.08.2026,
          // Teil des Verbraucher-Umbaus, gleiches Muster wie wildfleisch.html).
          if (d.titel) {
            var h1El = document.getElementById('page-titel');
            if (h1El) h1El.textContent = d.titel;
            document.title = d.titel + ' – Kreisjägerschaft Segeberg e.V.';
          }
          // Link-Liste (Seitenleiste) aus demselben JSON befüllen (Laurin-Wunsch
          // 23.08.2026: gleicher Baustein wie bei Wildfleisch, auf allen vier
          // Verbraucher-Hauptseiten einheitlich).
          if (Array.isArray(d.linkliste) && d.linkliste.length) {
            var lnNav = document.getElementById('linkliste-nav');
            var lnWidget = document.getElementById('linkliste-widget');
            var lnTitelEl = document.getElementById('linkliste-titel');
            if (lnTitelEl && d.linkliste_titel) lnTitelEl.textContent = d.linkliste_titel;
            if (lnNav && lnWidget) {
              d.linkliste.forEach(function(l) {
                if (!l || !l.url) return;
                var li = document.createElement('li');
                var externLink = /^https?:\/\//i.test(l.url);
                li.innerHTML = '<a href="' + l.url + '"' + (externLink ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + (l.titel || l.url) + '</a>';
                lnNav.appendChild(li);
              });
              lnWidget.style.display = '';
            }
          }
          var stTitelEl = document.getElementById('sub-seiten-titel');
          if (stTitelEl && d.unterseiten_titel) stTitelEl.textContent = d.unterseiten_titel;
          if (d.hero_bild) {
            var bg = document.querySelector('.page-hero__bg');
            if (bg) bg.style.backgroundImage = "url('" + d.hero_bild + "')";
          }
          var bild = d.bild ? '<img src="' + d.bild + '" alt="' + (d.bild_alt||'') + '" class="' + ((d.bild_groesse&&d.bild_groesse.indexOf('img-')===0)?d.bild_groesse:(d.bild_groesse==='klein'?'img-25':d.bild_groesse==='mittel'?'img-50':'img-100')) + '" style="border-radius:8px;margin-bottom:1.5rem;">' : '';
          var kontaktStr = '';
          if (d.kontakt_name || d.kontakt_email) {
            kontaktStr = '<p><strong>Kontakt:</strong> ' + (d.kontakt_name||'');
            if (d.kontakt_email) kontaktStr += ' &middot; <a href="mailto:' + d.kontakt_email + '">' + d.kontakt_email + '</a>';
            kontaktStr += '</p>';
          }
          main.innerHTML =
            '<h2>' + (d.untertitel||'') + '</h2>' +
            '<p>' + (d.intro||'') + '</p>' +
            bild +
            '<div id="page-inhalt"></div>' +
            kontaktStr +
            '<div class="btn-group" style="margin-top:2rem">' +
              '<a href="../termine/index.html" class="btn btn-primary">Termine ansehen</a>' +
              '<a href="../kontakt/index.html" class="btn btn-outline-green">Kontakt aufnehmen</a>' +
            '</div>';
          if (d.inhalt) {
            var el = document.getElementById('page-inhalt');
            if (el) {
              el.innerHTML = typeof marked !== 'undefined'
                ? (/<[a-z][\s\S]*>/i.test(d.inhalt) ? d.inhalt : marked.parse(d.inhalt))
                : d.inhalt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
            }
          }
        })
        .catch(function(err) {
          var main = document.getElementById('page-main');
          if (main) main.innerHTML = '<p style="color:red">Fehler: ' + (err && err.message ? err.message : String(err)) + '</p>';
        });
    </script>
    <aside class="sidebar">
      <!-- Unterseiten-Kacheln zuerst (Verbraucher-Umbau 22.08.2026, gleiches
           Muster wie wildfleisch.html: klarer/auffälliger, "Verbraucher"-Box
           rutscht dafür eine Position nach unten). -->
      <div class="sidebar-widget sidebar-widget--highlight" id="linkliste-widget" style="display:none;">
        <h4 id="linkliste-titel">Weiterführende Links</h4>
        <ul class="sidebar-nav" id="linkliste-nav"></ul>
      </div>
      <div class="sidebar-widget" id="sub-seiten-widget" style="display:none;">
        <h4 id="sub-seiten-titel">Unterseiten zu Grünes Klassenzimmer</h4>
        <ul class="unterseiten-tiles" id="sub-seiten-nav"></ul>
        <script>
          fetch('/content/seiten-sub-gruenes-klassenzimmer.json').then(function(r){return r.json();}).then(function(d){
            var nav = document.getElementById('sub-seiten-nav');
            var widget = document.getElementById('sub-seiten-widget');
            if (!nav) return;
            var seiten = (d.seiten || []).filter(function(s) { return s.veroeffentlicht !== false && s.in_navigation !== false; });
            if (!seiten.length) return;
            seiten.forEach(function(s) {
              var li = document.createElement('li');
              li.innerHTML = '<a class="unterseite-tile" href="../seiten/index.html?s=' + encodeURIComponent(s.slug) + '">' +
                '<span class="unterseite-tile__icon">' + ICONS.document + '</span>' +
                '<span class="unterseite-tile__label">' + (s.nav_label || s.slug) + '</span>' +
              '</a>';
              nav.appendChild(li);
            });
            widget.style.display = '';
          }).catch(function(){});
        </script>
      </div>
      <div class="sidebar-widget">
        <h4>Verbraucher</h4>
        <ul class="sidebar-nav" data-related-nav></ul>
      </div>
    </aside>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
