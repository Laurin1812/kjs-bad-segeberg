<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kreisjägermeister der Kreisjägerschaft Segeberg e.V.">
  <title>Kreisjägermeister – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>
<div id="siteHeader"></div>
<script src="/js/components.js"></script>
<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=50')"></div>
  <div class="container">
    <h1>Kreisjägermeister</h1>
    <nav class="breadcrumb"><a href="../index.html">Startseite</a><span class="sep">/</span><span>Kreisjägermeister</span></nav>
  </div>
</div>
<div class="page-content">
  <div class="container">
    <main class="main-content" id="kjm-content">
      <p style="color:var(--text-muted);">Wird geladen …</p>
    </main>
    <script>
      fetch('../content/kreisjjaegermeister.json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var name     = d.name     || '–';
          var email    = d.email    || '';
          var telefon  = d.telefon  || '';
          var bild     = d.bild     || '';
          var aufgaben = d.aufgaben || '';
          var grußwort = d.grußwort || '';

          var foto = bild
            ? `<img src="${bild}" alt="Foto ${name}" style="width:100%;border-radius:var(--radius-md);border:3px solid var(--green-main);object-fit:contain;padding:8px;">`
            : `<div style="width:100%;aspect-ratio:1;background:var(--green-light);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:5rem;border:3px solid var(--green-main);">👤</div>`;

          var grußwortHtml = grußwort
            ? grußwort.split('\n').filter(function(l){ return l.trim(); }).map(function(l){ return `<p>${l}</p>`; }).join('')
            : '';

          // Hinweis: die Sidebar-Kontaktbox (#kjm-sidebar-contact) wird NICHT mehr
          // hier überschrieben – main.js befüllt jede .contact-box automatisch mit
          // der einheitlichen "Adresse KJS"-Box aus content/einstellungen.json.
          // Vorher gab es hier ein eigenes "Direktkontakt"-Overlay, das mit main.js
          // um dasselbe Element konkurrierte (Race Condition je nach Ladezeit).

          document.getElementById('kjm-content').innerHTML = `
            <h2>Der Kreisjägermeister</h2>
            <p>Der Kreisjägermeister ist das höchste ehrenamtliche Amt der Kreisjägerschaft Segeberg e.V.
               Er vertritt die Interessen der Jägerinnen und Jäger im Kreis gegenüber Behörden,
               Politik und Öffentlichkeit.</p>
            <div class="kjm-profile-grid">
              <div>
                ${foto}
                <div style="margin-top:1rem;text-align:center;">
                  <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green-main);">Kreisjägermeister</div>
                  <div style="font-weight:700;font-size:1.1rem;margin-top:.25rem;">${name}</div>
                </div>
              </div>
              <div id="kjm-aufgaben-wrap">
                ${aufgaben ? (/<[a-z][\s\S]*>/i.test(aufgaben) ? aufgaben : (typeof marked !== 'undefined' ? marked.parse(aufgaben) : '<p>'+aufgaben.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>')) : ''}
                ${email || telefon ? `
                <h3>Kontakt</h3>
                <p>
                  ${email   ? `📧 <a href="mailto:${email}">${email}</a><br>` : ''}
                  ${telefon ? `📞 <a href="tel:${telefon.replace(/\s|-|\//g,'')}">${telefon}</a>` : ''}
                </p>` : ''}
              </div>
            </div>
            ${grußwortHtml ? `
            <h3>Grußwort des Kreisjägemeisters</h3>
            <div style="border-left:4px solid var(--gold);padding:1.5rem 1.5rem 1.5rem 2rem;background:var(--bg-light);border-radius:0 var(--radius-md) var(--radius-md) 0;font-style:italic;margin-top:.75rem;">
              ${grußwortHtml}
            </div>` : ''}
          `;
        });
    </script>
    <aside class="sidebar">
      <div class="sidebar-widget">
        <h4>Jäger</h4>
        <ul class="sidebar-nav" data-related-nav></ul>
      </div>
      <div class="contact-box" id="kjm-sidebar-contact">
        <h4>Adresse KJS</h4>
        <p style="color:var(--text-muted);font-size:.85rem;">Wird geladen …</p>
      </div>
    </aside>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="/js/main.js"></script>
</body>
</html>
