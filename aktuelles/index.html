<!-- Gemeinsame Datenschicht (Sichtbarkeit/Sortierung Termine & Aktuelles) -
     muss vor dem folgenden Inline-Script geladen werden. -->
<script src="../js/content.js"></script>
<script>
(function() {
  function formatDatum(raw) {
    if (!raw) return '';
    var mon = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    var enMon = {January:'Januar',February:'Februar',March:'März',April:'April',May:'Mai',June:'Juni',July:'Juli',August:'August',September:'September',October:'Oktober',November:'November',December:'Dezember'};
    var fixed = raw.replace(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\b/g, function(w){return enMon[w]||w;});
    if (fixed !== raw) return fixed;
    var m1 = raw.match(/^(\d{1,2})\.(\d{2})\.(\d{4})$/);
    if (m1) return parseInt(m1[1],10) + '. ' + mon[parseInt(m1[2],10)-1] + ' ' + m1[3];
    var m2 = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m2) return parseInt(m2[3],10) + '. ' + mon[parseInt(m2[2],10)-1] + ' ' + m2[1];
    return raw;
  }

  function getYear(datum) {
    if (!datum) return 0;
    var m = datum.match(/(\d{4})/);
    return m ? parseInt(m[1], 10) : 0;
  }

  // Erscheinungsjahr eines Beitrags (Frank-Wunsch Punkt 4): das Admin-Feld
  // "Erscheinungsjahr" (b.jahr) hat Vorrang und bestimmt, in welchem Archiv-
  // Jahr der Beitrag einsortiert wird – unabhängig vom eigentlichen Datum.
  // Ist es leer (ältere Beiträge ohne dieses Feld), fällt es automatisch
  // auf das Jahr aus dem Datum zurück (bisheriges Verhalten). Jetzt zentral
  // in js/content.js (KJSContent.Aktuelles.postYear) - dieselbe Regel gilt
  // damit auch für Startseite und beitrag.html.
  function postYear(b) {
    if (window.KJSContent) return window.KJSContent.Aktuelles.postYear(b);
    if (b && b.jahr) {
      var j = parseInt(b.jahr, 10);
      if (j) return j;
    }
    return getYear(b && b.datum);
  }

  function kurztext(md) {
    if (!md) return '';
    var plain = md
      .replace(/!\[.*?\]\(.*?\)/g, '')
      .replace(/\[([^\]]+)\]\(.*?\)/g, '$1')
      .replace(/[#*_>`~]/g, '')
      .replace(/\n+/g, ' ').trim();
    return plain.length > 150 ? plain.substring(0, 150) + ' …' : plain;
  }

  function renderKarte(b, i) {
    var imgSrc = b.bild ? (b.bild.startsWith('/') ? '..' + b.bild : '../' + b.bild) : '';
    return '<article class="news-card">' +
      '<a href="beitrag.html?i=' + i + '" style="text-decoration:none;color:inherit;display:block;">' +
        '<div class="news-card__img-wrap">' +
          (imgSrc
            ? '<img class="news-card__img" src="' + imgSrc + '" alt="' + b.titel.replace(/"/g,'') + '" loading="lazy">'
            : '<div style="background:var(--green-light);display:flex;align-items:center;justify-content:center;min-height:180px;"><img src="../images/logo.png" alt="KJS" style="height:64px;opacity:.3;"></div>') +
        '</div>' +
        '<div class="news-card__body">' +
          '<div class="news-card__meta">' +
            '<span class="news-card__cat">' + (b.kategorie || '') + '</span>' +
            '<span class="news-card__date">' + formatDatum(b.datum) + '</span>' +
          '</div>' +
          '<h3 class="news-card__title">' + b.titel + '</h3>' +
          '<p class="news-card__excerpt">' + kurztext(b.text) + '</p>' +
          '<span style="font-size:.88rem;font-weight:600;color:var(--green-main);">Weiterlesen →</span>' +
        '</div>' +
      '</a>' +
    '</article>';
  }

  var _allBeitraege = [];
  var _einst = {};
  // Frank-Wunsch: Klickt man oben im Hauptmenü auf "Aktuelles", sollen sofort
  // ALLE Beiträge (alle Jahre) angezeigt werden, nicht nur das aktuelle Jahr –
  // daher startet der Jahres-Filter direkt auf 'alle' statt auf 0.
  var _activeYear = 'alle';   // 'alle' = alle Jahre, Zahl = bestimmtes Jahr
  var _activeKategorien = []; // leer = kein Kategorie-Filter (alle), sonst Mehrfachauswahl

  // Sortier-Schlüssel für einen Beitrag: Jahr (mit Erscheinungsjahr-Override
  // über postYear) kombiniert mit Monat/Tag aus b.datum, egal ob im Format
  // "TT.MM.JJJJ" oder "JJJJ-MM-TT" gespeichert. Damit landen neuere Beiträge
  // zuverlässig oben und ältere unten – unabhängig von der Reihenfolge, in
  // der sie ursprünglich in content/aktuelles.json angelegt wurden.
  function beitragSortKey(b) {
    if (window.KJSContent) return window.KJSContent.Aktuelles.sortKey(b);
    var year = postYear(b) || 0;
    var monat = 0, tag = 0;
    var raw = (b && b.datum) || '';
    var m1 = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    var m2 = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m1) { tag = parseInt(m1[1], 10); monat = parseInt(m1[2], 10); }
    else if (m2) { monat = parseInt(m2[2], 10); tag = parseInt(m2[3], 10); }
    return year * 10000 + monat * 100 + tag;
  }

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function jahresFilter(yearFilter) {
    // Archivierte Beiträge dürfen in keiner der öffentlichen Standardansichten
    // erscheinen (31.08.2026, Architektur-Audit Punkt A3) - "alle Jahre" und
    // ein einzelnes gewähltes Jahr filterten archiviert bisher NICHT heraus,
    // obwohl "archiviert" laut Admin genau das bedeuten soll. Der Default-
    // Zweig unten (kein Jahr gewählt) filterte bereits korrekt und blieb
    // inhaltlich unverändert - "archiviert" wird jetzt überall über die
    // zentrale KJSContent.Aktuelles.nichtArchiviert() geprüft, statt hier
    // wiederholt "!b.archiviert" zu schreiben.
    var nichtArchiviert = window.KJSContent
      ? window.KJSContent.Aktuelles.nichtArchiviert(_allBeitraege)
      : _allBeitraege.filter(function(b) { return !b.archiviert; });
    if (yearFilter === 'alle') return nichtArchiviert;
    if (yearFilter > 0) return nichtArchiviert.filter(function(b) { return postYear(b) === yearFilter; });
    // Default: aktuelles Jahr, nicht archiviert, oder letzte N
    var anzahl = parseInt(_einst.hauptseite_anzahl, 10) || 0;
    var currentYear = new Date().getFullYear();
    if (anzahl > 0) return nichtArchiviert.slice(0, anzahl);
    var thisYear = nichtArchiviert.filter(function(b) { return postYear(b) === currentYear; });
    return thisYear.length > 0 ? thisYear : nichtArchiviert;
  }

  function jahresHeadline(yearFilter) {
    if (yearFilter === 'alle') return 'Alle Beiträge';
    if (yearFilter > 0) return 'Beiträge ' + yearFilter;
    var anzahl = parseInt(_einst.hauptseite_anzahl, 10) || 0;
    return anzahl > 0 ? 'Aktuelles (letzte ' + anzahl + ')' : 'Aktuelles aus unserer Kreisjägerschaft';
  }

  // Kombiniert Jahres-Archiv-Filter (bestehend) und Kategorie-Mehrfachauswahl
  // (Frank-Wunsch, überarbeitet: nicht mehr rechts in der Sidebar, sondern als
  // Checkbox-Auswahl direkt unter der Überschrift, kombinierbar mit dem
  // Jahres-Filter) – beide gleichzeitig aktiv.
  function applyFilters() {
    var grid = document.getElementById('news-grid');
    var headline = document.getElementById('aktuelles-headline');
    var filtered = jahresFilter(_activeYear);
    if (_activeKategorien.length) {
      filtered = filtered.filter(function(b) { return _activeKategorien.indexOf((b.kategorie || '').trim()) !== -1; });
    }
    if (headline) headline.textContent = jahresHeadline(_activeYear);
    if (!filtered.length) {
      grid.innerHTML = '<p style="color:var(--text-muted)">Keine Beiträge für diese Auswahl.</p>';
      return;
    }
    // Anzeige-Reihenfolge: neueste zuerst, älteste zuletzt. Wichtig: erst hier
    // auf einer KOPIE sortieren (nicht _allBeitraege selbst), damit origIdx
    // unten weiterhin die korrekte, unveränderte Position aus content/
    // aktuelles.json liefert (siehe Kommentar beim Laden weiter unten).
    var sorted = window.KJSContent
      ? window.KJSContent.Aktuelles.sortiertNeuesteZuerst(filtered)
      : filtered.slice().sort(function(a, b) { return beitragSortKey(b) - beitragSortKey(a); });
    // Map back to original indices for beitrag.html?i=
    grid.innerHTML = sorted.map(function(b) {
      var origIdx = _allBeitraege.indexOf(b);
      return renderKarte(b, origIdx);
    }).join('');
  }

  function buildArchivSidebar() {
    var sidebar = document.getElementById('archiv-jahre');
    if (!sidebar) return;
    // Nur Jahre anbieten, in denen mindestens ein NICHT archivierter Beitrag
    // existiert (Regressionstest-Fund 01.09.2026) - vorher konnte hier ein
    // Jahr erscheinen, das ausschließlich archivierte Beiträge enthielt und
    // beim Anklicken dann "Keine Beiträge für diese Auswahl" zeigte, obwohl
    // jahresFilter() selbst schon korrekt archivierte Beiträge ausschloss.
    // Zentrale Logik statt eigener Kopie - siehe js/content.js.
    var years = window.KJSContent
      ? window.KJSContent.Aktuelles.sichtbareJahre(_allBeitraege)
      : (function() {
          var ys = [];
          _allBeitraege.forEach(function(b) {
            if (b.archiviert) return;
            var y = postYear(b);
            if (y && ys.indexOf(y) === -1) ys.push(y);
          });
          ys.sort(function(a,b){return b-a;});
          return ys;
        })();

    if (!years.length) { sidebar.innerHTML = '<li><span style="color:var(--text-muted);font-size:.85rem">Keine Beiträge</span></li>'; return; }

    sidebar.innerHTML = years.map(function(y) {
      return '<li><a href="#" class="archiv-year-link" data-year="' + y + '">' + y + '</a></li>';
    }).join('') +
    '<li style="border-top:1px solid var(--border);margin-top:.5rem;padding-top:.5rem;">' +
      '<a href="#" class="archiv-year-link" data-year="alle" style="font-size:.85rem;color:var(--text-muted)">Alle anzeigen</a>' +
    '</li>';

    sidebar.querySelectorAll('.archiv-year-link').forEach(function(a) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        sidebar.querySelectorAll('.archiv-year-link').forEach(function(l){ l.style.fontWeight=''; });
        a.style.fontWeight = '700';
        var val = a.dataset.year;
        _activeYear = val === 'alle' ? 'alle' : parseInt(val, 10);
        _activeKategorien = []; // Kategorie-Auswahl bei Jahreswechsel zurücksetzen
        buildKategorieInline();
        applyFilters();
      });
    });
  }

  // Kategorie-Mehrfachauswahl (Frank-Wunsch, überarbeitet): nicht mehr rechts
  // in der Sidebar (verwirrend im Zusammenspiel mit dem Jahres-Archiv-Filter),
  // sondern als Checkbox-Auswahl direkt unter der Überschrift ("Beiträge
  // 2028" o.ä.). Die Liste wird aus den Beiträgen des GERADE aktiven
  // Jahres-Filters gebaut (nicht aus allen Beiträgen) und bei jedem
  // Jahreswechsel neu aufgebaut – zeigt also immer nur Kategorien, die im
  // gewählten Jahr auch tatsächlich vorkommen. Neue, im Admin frei
  // eingetippte Kategorien (Punkt 3) tauchen hier automatisch auf.
  function buildKategorieInline() {
    var wrap = document.getElementById('kategorie-filter-inline');
    if (!wrap) return;
    var basis = jahresFilter(_activeYear);
    var kats = [];
    basis.forEach(function(b) {
      var k = (b.kategorie || '').trim();
      if (k && kats.indexOf(k) === -1) kats.push(k);
    });
    if (!kats.length) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
    kats.sort(function(a, b) { return a.localeCompare(b, 'de'); });

    var alleChecked = _activeKategorien.length === 0;
    var html = '<div style="font-size:.82rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem;">' +
      'Kategorien filtern (mehrere möglich)</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.88rem;">' +
      '<label style="display:flex;align-items:center;gap:.35rem;cursor:pointer;">' +
        '<input type="checkbox" class="kat-inline-alle"' + (alleChecked ? ' checked' : '') + '> Alle anzeigen' +
      '</label>' +
      kats.map(function(k) {
        var checked = _activeKategorien.indexOf(k) !== -1;
        return '<label style="display:flex;align-items:center;gap:.35rem;cursor:pointer;">' +
          '<input type="checkbox" class="kat-inline-item" value="' + escHtml(k) + '"' + (checked ? ' checked' : '') + '> ' + escHtml(k) +
        '</label>';
      }).join('') +
      '</div>';
    wrap.innerHTML = html;
    wrap.style.display = '';

    var alleBox = wrap.querySelector('.kat-inline-alle');
    var itemBoxes = wrap.querySelectorAll('.kat-inline-item');

    alleBox.addEventListener('change', function() {
      if (alleBox.checked) {
        _activeKategorien = [];
        itemBoxes.forEach(function(b) { b.checked = false; });
        applyFilters();
      } else {
        alleBox.checked = true; // "Alle" lässt sich nicht direkt abwählen, nur über Einzelauswahl verlassen
      }
    });

    itemBoxes.forEach(function(box) {
      box.addEventListener('change', function() {
        if (box.checked) {
          alleBox.checked = false;
          if (_activeKategorien.indexOf(box.value) === -1) _activeKategorien.push(box.value);
        } else {
          _activeKategorien = _activeKategorien.filter(function(k) { return k !== box.value; });
          if (!_activeKategorien.length) alleBox.checked = true;
        }
        applyFilters();
      });
    });
  }

  fetch('../content/aktuelles.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      // WICHTIG: _allBeitraege NICHT umsortieren – beitrag.html liest denselben
      // content/aktuelles.json direkt und greift per URL-Parameter (?i=N) auf
      // beitraege[N] in der UNVERÄNDERTEN JSON-Reihenfolge zu. Würde hier
      // sortiert, würde origIdx (siehe applyFilters, _allBeitraege.indexOf)
      // zwar noch zur eigenen Anzeige passen, aber der Link ?i=N würde auf
      // der Detailseite auf einen völlig anderen Beitrag zeigen (genau der
      // Bug, den Frank gemeldet hat: Kachel "Jagdhornblasen" öffnete einen
      // Pressemitteilung-Artikel). Sortiert wird stattdessen erst die
      // gefilterte Kopie in applyFilters(), origIdx bleibt dabei korrekt.
      _allBeitraege = data.beitraege || [];
      _einst = data.einstellungen || {};
      buildArchivSidebar();
      buildKategorieInline();
      applyFilters(); // default view: alle Jahre, neueste zuerst
      var alleLink = document.querySelector('.archiv-year-link[data-year="alle"]');
      if (alleLink) alleLink.style.fontWeight = '700';
    })
    .catch(function() {
      document.getElementById('news-grid').innerHTML = '<p>Beiträge konnten nicht geladen werden.</p>';
    });
})();
</script>
