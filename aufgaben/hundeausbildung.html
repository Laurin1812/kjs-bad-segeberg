<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hundeausbildung – Kreisjägerschaft Segeberg e.V.">
  <title>Hundeausbildung – Kreisjägerschaft Segeberg e.V.</title>
  <link rel="stylesheet" href="../css/style.css">
<script>
  fetch('/content/design.json').then(r=>r.json()).then(d=>{
    const r = document.documentElement.style;
    if(d.farbe_gruen) r.setProperty('--green-main', d.farbe_gruen);
    if(d.farbe_dunkelgruen) r.setProperty('--green-dark', d.farbe_dunkelgruen);
    if(d.farbe_akzent) r.setProperty('--gold', d.farbe_akzent);
    if(d.schrift_ueberschrift) r.setProperty('--font-heading', `"${d.schrift_ueberschrift}", serif`);
    if(d.schrift_text) r.setProperty('--font-sans', `"${d.schrift_text}", sans-serif`);
    if(d.schriftgroesse_h1) r.setProperty('--fs-h1', d.schriftgroesse_h1);
    if(d.schriftgroesse_h2) r.setProperty('--fs-h2', d.schriftgroesse_h2);
    if(d.schriftgroesse_h3) r.setProperty('--fs-h3', d.schriftgroesse_h3);
    if(d.schriftgroesse_text) r.setProperty('--fs-text', d.schriftgroesse_text);
  }).catch(()=>{});
</script>
</head>
<body>

<div id="siteHeader"></div>
<script src="/js/components.js"></script>

<div class="page-hero">
  <div class="page-hero__bg" style="background-image: url('../images/hundeausbildung.jpg')"></div>
  <div class="container">
    <h1>Hundeausbildung</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb" id="siteBreadcrumb"></nav>
  </div>
</div>

<div class="page-content">
  <div class="container">
    <main class="main-content" id="page-main">
      <div class="loading-spinner">Lädt...</div>
    </main>
    <script>
      fetch('/content/aufgaben/hundeausbildung.json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var main = document.getElementById('page-main');
          if (!main) return;
          if (d.hero_bild) {
            var bg = document.querySelector('.page-hero__bg');
            if (bg) bg.style.backgroundImage = "url('" + d.hero_bild + "')";
          }
          var bild = d.bild ? '<img src="' + d.bild + '" alt="' + (d.bild_alt||'') + '" class="' + ((d.bild_groesse&&d.bild_groesse.indexOf('img-')===0)?d.bild_groesse:(d.bild_groesse==='klein'?'img-25':d.bild_groesse==='mittel'?'img-50':'img-100')) + '" style="border-radius:8px;margin-bottom:1.5rem;">' : '';
          var kontaktStr = '';
          if (d.kontakt_name || d.kontakt_email) {
            kontaktStr = '<p><strong>Kontakt:</strong> ' + (d.kontakt_name||'');
            if (d.kontakt_email) kontaktStr += ' &middot; <a href="mailto:' + d.kontakt_email + '">' + d.kontakt_email + '</a>';
            kontaktStr += '</p>';
          }
          main.innerHTML =
            '<h2>' + (d.untertitel||'') + '</h2>' +
            '<p>' + (d.intro||'') + '</p>' +
            bild +
            '<div id="page-inhalt"></div>' +
            kontaktStr +
            '<div class="btn-group" style="margin-top:2rem">' +
              '<a href="../termine/index.html" class="btn btn-primary">Termine ansehen</a>' +
              '<a href="../kontakt/index.html" class="btn btn-outline-green">Kontakt aufnehmen</a>' +
            '</div>';
          if (d.inhalt) {
            var el = document.getElementById('page-inhalt');
            if (el) {
              el.innerHTML = typeof marked !== 'undefined'
                ? (/<[a-z][\s\S]*>/i.test(d.inhalt) ? d.inhalt : marked.parse(d.inhalt))
                : d.inhalt.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n\n').join('</p><p>').split('\n').join('<br>');
            }
          }

          // Sidebar-CTA "Alle Kurse & Themen ansehen" (rechts, oben in der
          // Jagdhundeschule-Sidebar-Box) bekommt die tatsächliche Anzahl der
          // veröffentlichten Kurse/Themen als Beschriftung.
          fetch('/content/aufgaben/hundeausbildung-seiten.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var cta = document.getElementById('jagdhundeschule-cta');
              if (!cta) return;
              var seiten = (data.seiten || []).filter(function(s) { return s.veroeffentlicht !== false; });
              if (seiten.length) {
                cta.textContent = 'Alle ' + seiten.length + ' Kurse & Themen ansehen →';
              }
            })
            .catch(function() {});
        })
        .catch(function(err) {
          var main = document.getElementById('page-main');
          if (main) main.innerHTML = '<p style="color:var(--text-muted)">Inhalt konnte nicht geladen werden.</p>';
          console.error(err);
        });
    </script>
    <aside class="sidebar">
      <div class="sidebar-widget">
        <h4>Jagdhundeschule</h4>
        <a href="jagdhundeschule.html" id="jagdhundeschule-cta" class="btn btn-primary" style="display:block;text-align:center;">Alle Kurse & Themen ansehen →</a>
      </div>
      <div class="sidebar-widget">
        <h4>Aufgaben des Hegerings</h4>
        <ul class="sidebar-nav" data-related-nav></ul>
      </div>
      <div class="contact-box">
        <h4>Kontakt</h4>
        <p>📧 <a href="mailto:info@kjs-bad-segeberg.de">info@kjs-bad-segeberg.de</a></p>
        <p>📞 <a href="tel:+494551123456">04551 / 12 34 56</a></p>
      </div>
    </aside>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
